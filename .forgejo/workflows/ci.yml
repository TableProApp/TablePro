name: lab-ci

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: lab-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/linux' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TABLEPRO_GTK_WAIT_SECONDS: "45"
  TABLEPRO_GTK_SCENARIO_RETRIES: "1"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_TARGET_DIR: /var/cache/ci/target/${{ github.job }}

jobs:
  guards:
    runs-on: any-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Script harness and guards
        run: |
          cd src
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-function-size.py
          python3 scripts/check-comment-lines.py
          cargo fmt --all -- --check

  clippy:
    runs-on: any-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Clippy
        run: |
          cd src && cargo clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings

  unit:
    runs-on: any-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Unit tests
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
        run: |
          cd src
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          "$NEXTEST" nextest run --workspace --exclude tablepro-driver-duckdb --lib --bins --profile ci --no-tests=pass

  sandbox:
    runs-on: any-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Sandbox tier
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
          TABLEPRO_NEXTEST_PROFILE: ci
        run: |
          cd src && bash scripts/test-sandbox.sh

  widgets:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: GTK widget tests
        run: |
          cd src && bash scripts/test-gtk-widgets.sh

  distro-floor:
    runs-on: any-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/floor-${{ matrix.base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "ubuntu:24.04"
            mcp_port_slot: 10
          - base: "debian:13"
            mcp_port_slot: 11
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Build or reuse the distro-floor package
        run: |
          cd src && bash scripts/distro-floor-package.sh "${{ github.sha }}" > floor-package-path
      - name: Distro floor
        run: |
          cd src && package=$(cat floor-package-path) && DISTRO_FLOOR_PACKAGE="$package" bash scripts/test-distro-floor.sh ${{ matrix.base }}
      - name: Debian package build, install, upgrade from the released package and purge
        run: |
          released=/var/cache/ci/releases/tablepro_0.1.5-1_amd64.deb
          if [ ! -s "$released" ]; then
            mkdir -p "$(dirname "$released")"
            curl -fsSL -o "$released.part" https://github.com/cozyGarage/BookiE/releases/download/linux-v0.1.5/tablepro_0.1.5-1_amd64.deb
            mv "$released.part" "$released"
          fi
          cd src && package=$(cat floor-package-path) && PREVIOUS_DEB="$released" PREBUILT_DEB="$package" bash scripts/test-deb-package.sh ${{ matrix.base }}
  driver:
    runs-on: any-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/driver-${{ matrix.driver }}
      TABLEPRO_TEST_RUN_ID: forgejo-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.driver }}
    strategy:
      fail-fast: false
      matrix:
        driver: [postgres, mysql, mssql, clickhouse, redis, mongodb]
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Driver integration
        run: |
          cd src
          cleanup_testcontainers() {
            python3 scripts/cleanup-testcontainers.py "$TABLEPRO_TEST_RUN_ID"
          }
          trap cleanup_testcontainers EXIT
          trap 'cleanup_testcontainers; exit 143' TERM
          trap 'cleanup_testcontainers; exit 130' INT
          cargo test --locked -p tablepro-driver-${{ matrix.driver }} --test integration -- --include-ignored --test-threads=1

  e2e:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/e2e-${{ matrix.server }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: postgres
            mcp_port_slot: 5
          - server: mysql
            mcp_port_slot: 6
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Real server end to end
        run: |
          cd src && bash scripts/test-gtk-${{ matrix.server }}.sh

  consumers:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/consumers
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: MCP, policy sessions
        run: |
          cd src
          cargo test --locked -p tablepro-mcp --test mongodb_extended_json -- --include-ignored --test-threads=1
          cargo test --locked -p tablepro-policy --test session_postgres -- --include-ignored --test-threads=1
          cargo test --locked -p tablepro-policy --test session_mssql -- --include-ignored --test-threads=1
      - name: App server tests
        run: |
          cd src && python3 scripts/run-isolated-tests.py app-server

  gtk:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/gtk-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.shard }}"
      - name: Installed GTK end-to-end suite, one third
        run: |
          cd src && TABLEPRO_GTK_SHARD=${{ matrix.shard }}/3 bash scripts/test-gtk-safety.sh

  duckdb:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/duckdb
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: DuckDB driver and the app with DuckDB
        run: |
          cd src
          cargo clippy --locked -p tablepro-driver-duckdb --all-targets -- -D warnings
          cargo test --locked -p tablepro-driver-duckdb -- --include-ignored
          cargo build --locked -p tablepro-app --features duckdb
  pg-release:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/pg-release
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py 4
      - name: PostgreSQL release fixture
        run: |
          cd src && ./scripts/test-postgres-release.sh

  pg-dump:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/pg-dump
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: pg_dump against PostgreSQL
        run: cd src && ./scripts/test-pg-dump.sh

  socket-ssh:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/socket-ssh
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: PostgreSQL socket and SSH fixtures
        run: |
          cd src
          ./scripts/test-postgres-socket.sh
          bash ./scripts/test-ssh.sh

  gtk-server:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/gtk-server-${{ matrix.server }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: clickhouse
            mcp_port_slot: 7
          - server: mysql-approval
            mcp_port_slot: 8
          - server: mongodb
            mcp_port_slot: 9
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Installed GTK scenarios against a real server
        run: |
          cd src && bash scripts/test-gtk-${{ matrix.server }}.sh
  driver-tls:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/driver-tls
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Driver TLS fixtures
        run: |
          cd src && ./scripts/test-driver-tls.sh

  keyring:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/keyring
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Secret Service tier
        run: |
          cd src && ./scripts/test-secret-service.sh

  supply-chain:
    runs-on: any-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/supply-chain
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Supply-chain tools
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny --version 0.20.2
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit --version 0.22.2
      - name: Advisories, licenses and sources
        run: |
          cd src && python3 scripts/run-test-layer.py supply-chain
      - name: Vendored crates equal upstream plus their patches
        run: |
          cd src && python3 scripts/vendor-patches.py check
