name: nightly
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: bookie-lab
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G

jobs:
  coverage:
    runs-on: debian-host
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-coverage
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Coverage tools
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov
      - name: Line coverage of the unit tier
        run: |
          cd src
          cargo llvm-cov --workspace --exclude tablepro-driver-duckdb --lib --bins --json --summary-only --output-path /tmp/coverage.json
          python3 scripts/check-coverage-floor.py /tmp/coverage.json

  docker-coverage:
    runs-on: debian-host
    needs: coverage
    if: ${{ !cancelled() }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-docker-cov-${{ matrix.driver }}
      RUSTC_WRAPPER: ""
      TABLEPRO_TEST_RUN_ID: nightly-${{ github.run_id }}-${{ matrix.driver }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        driver: [postgres, mysql, sqlite, mongodb, redis, clickhouse]
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        run: bash src/scripts/docker-hub-login.sh
      - name: Coverage tools
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov
      - name: Line coverage with the Docker suite, against the crate floor
        run: |
          cd src
          cleanup_testcontainers() {
            python3 scripts/cleanup-testcontainers.py "$TABLEPRO_TEST_RUN_ID"
          }
          trap cleanup_testcontainers EXIT
          targets=(--lib --tests)
          [ "${{ matrix.driver }}" = postgres ] && targets=(--lib --test integration)
          cargo llvm-cov --no-report --locked -p "tablepro-driver-${{ matrix.driver }}" "${targets[@]}" -- --include-ignored --test-threads=1
          cargo llvm-cov report --json --summary-only --output-path /tmp/coverage-${{ matrix.driver }}.json
          python3 scripts/check-crate-coverage-floors.py /tmp/coverage-${{ matrix.driver }}.json --only "crates/drivers/${{ matrix.driver }}"

  mutation:
    runs-on: debian-host
    needs: coverage
    if: ${{ !cancelled() }}
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-mutants-${{ matrix.label }}
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {label: core-1, package: tablepro-core, shard: 0/4}
          - {label: core-2, package: tablepro-core, shard: 1/4}
          - {label: core-3, package: tablepro-core, shard: 2/4}
          - {label: core-4, package: tablepro-core, shard: 3/4}
          - {label: policy-1, package: tablepro-policy, shard: 0/2}
          - {label: policy-2, package: tablepro-policy, shard: 1/2}
          - {label: ssh, package: tablepro-ssh, shard: 0/1}
          - {label: redis, package: tablepro-driver-redis, shard: 0/1}
          - {label: postgres, package: tablepro-driver-postgres, shard: 0/1}
          - {label: agentd, package: tablepro-agentd, shard: 0/1}
          - {label: transport, package: tablepro-transport, shard: 0/1}
          - {label: app-services, package: tablepro-app-services, shard: 0/1}
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Mutation tool
        run: |
          command -v cargo-mutants >/dev/null || cargo install --locked cargo-mutants --version ^27
      - name: Mutants that no test notices
        run: |
          cd src
          args=(--package "${{ matrix.package }}" --test-tool cargo --shard "${{ matrix.shard }}"
                --output "/tmp/mutants-${{ matrix.label }}" --timeout 60 --build-timeout 900 --no-shuffle)
          if [ "${{ matrix.package }}" = tablepro-driver-postgres ]; then
            args+=(--file crates/drivers/postgres/src/array.rs --file crates/drivers/postgres/src/numeric.rs
                   --file crates/drivers/postgres/src/temporal.rs --file crates/drivers/postgres/src/decode.rs)
          fi
          status=0
          test_args=(--lib)
          [ "${{ matrix.package }}" = tablepro-agentd ] && test_args+=(--bins --tests)
          cargo mutants "${args[@]}" -- "${test_args[@]}" || status=$?
          partial=()
          [ "${{ matrix.shard }}" = 0/1 ] || partial=(--partial)
          python3 scripts/check-mutants-baseline.py "${{ matrix.package }}" "/tmp/mutants-${{ matrix.label }}" "$status" "${partial[@]}"

  gtk-soak:
    runs-on: debian-host
    needs: [docker-coverage, mutation]
    if: ${{ !cancelled() }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-soak
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.run }}"
      - name: Five retry-free installed GTK attempts
        run: |
          cd src
          cargo build --release --locked -p tablepro-app --bin tablepro-app
          binary="$PWD/target-soak-${{ matrix.run }}/usr/bin/tablepro"
          install -Dm755 "$CARGO_TARGET_DIR/release/tablepro-app" "$binary"
          for attempt in 1 2 3 4 5; do
            echo "soak run ${{ matrix.run }} attempt $attempt at $(git rev-parse HEAD)"
            TABLEPRO_GTK_BINARY="$binary" bash scripts/test-gtk-safety.sh >"/tmp/soak-${{ matrix.run }}-$attempt.log" 2>&1 || {
              grep -aE "^passed:|^FAILED|scenario.s. failed|AssertionError" "/tmp/soak-${{ matrix.run }}-$attempt.log" | tail -20
              exit 1
            }
          done

  arch-package:
    runs-on: debian-host
    needs: [docker-coverage, mutation]
    if: ${{ !cancelled() }}
    timeout-minutes: 120
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Build the Arch package in a container and upgrade from the released one
        run: |
          cd src && bash scripts/test-arch-package-container.sh
  values:
    runs-on: debian-host
    needs: [docker-coverage, mutation]
    if: ${{ !cancelled() }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-values
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Shared value contracts across drivers, GTK and DuckDB
        run: |
          cd src && python3 scripts/run-test-layer.py values
  gtk-ubuntu:
    runs-on: ubuntu-host
    needs: [docker-coverage, mutation]
    if: ${{ !cancelled() }}
    continue-on-error: true
    timeout-minutes: 60
    env:
      TABLEPRO_GTK_WAIT_SECONDS: "45"
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-gtk-ubuntu-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            mcp_port_slot: 7
          - shard: 2
            mcp_port_slot: 8
          - shard: 3
            mcp_port_slot: 9
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Installed GTK end-to-end suite on native Ubuntu 24.04, one third
        run: |
          cd src && TABLEPRO_GTK_SHARD=${{ matrix.shard }}/3 bash scripts/test-gtk-safety.sh

