name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Open a MySQL connection
        2. Run a SELECT query
        3. Click on a cell to edit
        4. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: database
    attributes:
      label: Database type
      options:
        - MySQL / MariaDB
        - PostgreSQL
        - SQLite
        - SQL Server
        - MongoDB
        - Redis
        - ClickHouse
        - Oracle
        - N/A
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: TablePro version
      description: >-
        About TablePro shows it, with the build number in parentheses and any -beta.N. On macOS, updates install
        in the background, so this is often not the newest. On Linux, `tablepro --version` prints it too.
      placeholder: "0.82.0 (820099)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which TablePro app this is about.
      options:
        - macOS
        - iOS
        - Linux
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version & hardware
      description: >-
        On Linux, the distribution and its version, and the desktop and session,
        which `echo $XDG_CURRENT_DESKTOP $XDG_SESSION_TYPE` prints.
      placeholder: "macOS 15.3 / Apple Silicon, or Ubuntu 26.04 / GNOME, wayland"
    validations:
      required: false

  - type: dropdown
    id: linux-install
    attributes:
      label: Installed from (Linux)
      options:
        - Ubuntu PPA
        - Fedora COPR
        - Built from source
    validations:
      required: false

  - type: textarea
    id: linux-debug-info
    attributes:
      label: Debugging information (Linux)
      description: >-
        About TablePro > Troubleshooting > Debugging Information, then Copy Text.
        It holds versions, not connection details.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots / Logs
      description: >-
        If applicable, add screenshots, screen recordings, or crash logs.
        On Linux, `journalctl --user --boot | grep -i tablepro` shows the log, and crash reports
        are in `~/.local/state/tablepro/crashes/`. Logs name your hosts and tables, so read them first.
    validations:
      required: false
