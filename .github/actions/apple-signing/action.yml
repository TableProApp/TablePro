name: Apple signing
description: Imports the Developer ID certificate, stores the notary credentials as the TablePro profile, and installs the provisioning profile.

inputs:
  certificate-p12:
    description: Base64 of the .p12 holding the Developer ID Application certificate.
    required: true
  certificate-password:
    description: Password for that .p12.
    required: true
  provisioning-profile:
    description: Base64 of the provisioning profile. Omit to skip installing one.
    required: false
    default: ""
  asc-key-id:
    description: Key ID of the App Store Connect API key notarytool authenticates with.
    required: true
  asc-issuer-id:
    description: Issuer ID of that key.
    required: true
  asc-key-p8:
    description: Contents of that key's .p8 file.
    required: true

runs:
  using: composite
  steps:
    - name: Import signing certificate
      shell: bash
      env:
        CERTIFICATES_P12: ${{ inputs.certificate-p12 }}
        CERTIFICATES_PASSWORD: ${{ inputs.certificate-password }}
      # A keychain of its own, unlocked with an empty password and given a six hour lock timeout,
      # so a long notarization wait cannot relock it mid-run. The runner is thrown away afterwards.
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        security create-keychain -p "" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "" "$KEYCHAIN_PATH"
        echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATES_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        rm -f "$RUNNER_TEMP/certificate.p12"
        security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

        certificate="$RUNNER_TEMP/certificate.pem"
        security find-certificate -c "Developer ID Application" -p "$KEYCHAIN_PATH" > "$certificate"
        expiry="$(openssl x509 -noout -enddate -in "$certificate" | sed 's/^notAfter=//')"
        if ! openssl x509 -noout -checkend $((60 * 24 * 3600)) -in "$certificate" > /dev/null; then
          echo "::warning::The Developer ID Application certificate expires on $expiry"
        fi
        rm -f "$certificate"
        echo "Developer ID Application certificate valid until $expiry"

    - name: Store the notary credentials
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        ASC_KEY_P8: ${{ inputs.asc-key-p8 }}
      # notarytool copies the key into the keychain item, so the file can go at once.
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
        (umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$key")
        status=0
        xcrun notarytool store-credentials "TablePro" --key "$key" --key-id "$ASC_KEY_ID" \
          --issuer "$ASC_ISSUER_ID" || status=$?
        rm -f "$key"
        exit "$status"

    - name: Install provisioning profile
      if: inputs.provisioning-profile != ''
      shell: bash
      env:
        PROVISIONING_PROFILE: ${{ inputs.provisioning-profile }}
      run: |
        set -euo pipefail
        profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$profiles"
        printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$profiles/tablepro.provisionprofile"
