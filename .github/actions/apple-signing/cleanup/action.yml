name: Apple signing cleanup
description: Restores the user keychain search list apple-signing saved and deletes its keychain, notary key and provisioning profile. Run it in an always() step.

runs:
  using: composite
  steps:
    # A leftover is a warning, not a failed release: the runner empties RUNNER_TEMP after the job anyway.
    - shell: bash
      run: |
        set -uo pipefail
        dir="$RUNNER_TEMP/apple-signing"
        if [ -f "$dir/search-list" ]; then
          saved=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then
              saved+=("$keychain")
            fi
          done < "$dir/search-list"
          security list-keychains -d user -s ${saved[@]+"${saved[@]}"} \
            || echo "::warning::Could not restore the user keychain search list"
        fi
        if [ -e "$dir/signing.keychain-db" ]; then
          security delete-keychain "$dir/signing.keychain-db" \
            || echo "::warning::Could not delete the signing keychain"
        fi
        rm -rf "$dir" || echo "::warning::Could not delete $dir"
        rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/tablepro.provisionprofile" \
          || echo "::warning::Could not delete the provisioning profile"
        echo "User keychain search list:"
        security list-keychains -d user || true
