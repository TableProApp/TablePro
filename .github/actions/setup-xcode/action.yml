name: Select Xcode
description: Selects the one Xcode every TablePro build and test job uses.

inputs:
  require-release:
    description: true fails the job unless the selected Xcode is Apple's released build, as a stable build requires.
    required: false
    default: "false"

# The only place the version and build are written. The bundle name differs by machine
# (Xcode_27.1_Release_Candidate.app on xcode-27, Xcode.app on a Mac), so it is found by its version.plist.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        XCODE_VERSION: "27.1"
        # The 27.1 beta, 27A9269, has the same version, so every job also checks the build.
        XCODE_BUILD: 27A9275
        # Apple's released 27.1 (developer.apple.com/news/releases). The 27.1 beta also says GM.
        XCODE_RELEASE_BUILD: 27A9275
        REQUIRE_RELEASE: ${{ inputs.require-release }}
      run: |
        set -euo pipefail
        matches=()
        installed=""
        for app in /Applications/Xcode*.app; do
          if [ -L "$app" ] || [ ! -d "$app" ]; then
            continue
          fi
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/version.plist" 2> /dev/null || true)"
          build="$(plutil -extract ProductBuildVersion raw -o - "$app/Contents/version.plist" 2> /dev/null || true)"
          installed="$installed $app ($version $build)"
          if [ "$version" = "$XCODE_VERSION" ] && [ "$build" = "$XCODE_BUILD" ]; then
            matches+=("$app")
          fi
        done
        if [ "${#matches[@]}" -ne 1 ]; then
          echo "::error::Expected one Xcode $XCODE_VERSION ($XCODE_BUILD) in /Applications, found ${#matches[@]}:${installed:- no Xcode}"
          exit 1
        fi

        app="${matches[0]}"
        export DEVELOPER_DIR="$app/Contents/Developer"
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        xcodebuild -version

        build="$(plutil -extract ProductBuildVersion raw -o - "$app/Contents/version.plist")"
        license="$(plutil -extract licenseType raw -o - "$app/Contents/Resources/LicenseInfo.plist" 2> /dev/null || true)"
        echo "$app: build $build, licenseType ${license:-missing}"
        [ "$REQUIRE_RELEASE" = true ] || exit 0
        if [ "$build" != "$XCODE_RELEASE_BUILD" ] || [ "$license" != GM ]; then
          echo "::error::$app is $build with licenseType '$license', not Apple's released Xcode $XCODE_VERSION ($XCODE_RELEASE_BUILD, GM); a stable release builds only on it"
          exit 1
        fi
        echo "$app is Apple's released Xcode $XCODE_VERSION"
