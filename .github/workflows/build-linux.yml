name: Build Linux

on:
  push:
    branches: [main, linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  pull_request:
    branches: [main, linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""

permissions:
  contents: read
  packages: read

# A newer pull request push supersedes its in-flight run. Push runs on
# linux or main keep the cheap tier only; Forgejo is the merge gate.
# Scheduled and dispatched runs keep their own group so a manual full
# Build Linux is never cancelled by ordinary branch traffic.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-revision:
    name: Pin tested revision
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'linux') || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin the tested revision once
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "tree under test: $revision"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_REF" ]]; then
            case "$REQUESTED_REF" in
              refs/pull/*|pull/*)
                echo "workflow_dispatch cannot pin a pull request ref" >&2
                exit 1
                ;;
            esac
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
            if ! git branch -r --contains "$revision" | grep -qE 'origin/' \
              && ! git tag --contains "$revision" | grep -q .; then
              echo "pinned revision must be on an origin branch or tag" >&2
              exit 1
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  ensure-ci-gtk-image:
    name: Ensure CI debian-testing GTK image
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull or build and push
        id: publish
        env:
          IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk
        run: |
          set -euo pipefail
          hash="$(sha256sum ci/debian-testing-gtk/Dockerfile | cut -c1-16)"
          tag="df-${hash}"
          tag_hash="${IMAGE}:${tag}"
          tag_latest="${IMAGE}:latest"
          if ! docker pull "$tag_hash"; then
            docker build --pull \
              -t "$tag_hash" \
              -t "$tag_latest" \
              -f ci/debian-testing-gtk/Dockerfile \
              ci/debian-testing-gtk
            docker push "$tag_hash"
            docker push "$tag_latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight and sandbox tier (no GTK app)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/linux' || github.ref == 'refs/heads/main')) }}
      - name: Preflight
        run: python3 scripts/run-test-layer.py quick

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  fast:
    name: Fast checks (GTK)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    # The GNOME 50 baseline requires GTK 4.22, GLib 2.88 and libadwaita 1.9.
    # Pre-baked debian:testing + GTK deps from ci/debian-testing-gtk.
    # The integration job stays on the host runner — driver crates depend
    # only on tablepro-core, so they don't pull in libadwaita.
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          pkg-config --exists 'glib-2.0 >= 2.80'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: false
      - name: Focused tests for changed B3 value paths
        env:
          TABLEPRO_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/run-test-layer.py change-contracts
      - name: Unit tests (build via test)
        run: python3 scripts/run-test-layer.py full
      - name: Isolated GTK widget regressions
        run: python3 scripts/run-test-layer.py widgets
      - name: App numeric parser against PostgreSQL
        run: python3 scripts/run-test-layer.py app-server

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/*-layers
            target/quality/*-change-contracts
          if-no-files-found: error

  gtk-safety:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Installed GTK safety smoke
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, fast]
    container:
      image: debian:testing
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install GTK test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libssl-dev libsecret-1-dev libsecret-tools libkrb5-dev libsqlite3-dev clang \
            dbus-daemon gnome-keyring libglib2.0-bin xvfb xauth at-spi2-core python3-pyatspi scrot
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-gtk-safety
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Secret Service round-trip
        run: python3 scripts/run-test-layer.py keyring
      - name: GTK installed-flow smoke
        env:
          TABLEPRO_GTK_ARTIFACT_DIR: ${{ github.workspace }}/gtk-artifacts/smoke
        run: python3 scripts/run-test-layer.py ui
      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: gtk-artifacts
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  current-stable-clippy:
    name: Current stable Clippy (scheduled)
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: pin-revision
    container:
      image: debian:testing
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-current-stable-clippy
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Clippy on current stable
        # The repository override selects 1.98, so +stable is required here.
        run: cargo +stable clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Driver integration tests (docker)
    timeout-minutes: 55
    runs-on: ubuntu-24.04
    needs: [pin-revision, b4-rollback]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang \
            dbus-daemon \
            gnome-keyring \
            libsecret-tools \
            libglib2.0-bin
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-integration
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker version
      - name: Driver, socket and SSH integration
        run: python3 scripts/run-test-layer.py drivers

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  b4-rollback:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: B4 rollback acceptance (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-integration
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker version
      - name: Focused MySQL and PostgreSQL rollback cases
        run: python3 scripts/run-test-layer.py b4-rollback

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-b4-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  driver-tls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Driver TLS fixture (docker)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-driver-tls
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker compose version
      - name: Driver TLS fixture
        run: python3 scripts/run-test-layer.py tls

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-driver-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  postgres-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: PostgreSQL release fixture (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      # test-postgres-release.sh builds the GTK app and runs PostgreSQL AT-SPI scenarios.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang \
            openssh-client \
            dbus-daemon \
            gnome-keyring \
            libsecret-tools \
            libglib2.0-bin \
            xvfb \
            xauth \
            at-spi2-core \
            python3-pyatspi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-postgres-release
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Build staged release GTK binary
        run: cargo build --locked --release -p tablepro-app
      - name: Stage release binary for installed GTK scenarios
        run: install -Dm755 target/release/tablepro-app target/installed/usr/bin/tablepro
      - name: Verify docker is available
        run: docker compose version
      - name: PostgreSQL TLS, SSH, lock, and reconnect fixture
        env:
          TABLEPRO_GTK_BINARY: target/installed/usr/bin/tablepro
        run: python3 scripts/run-test-layer.py postgres-release

      - name: MySQL human-approval dialog regression
        env:
          TABLEPRO_GTK_BINARY: target/installed/usr/bin/tablepro
        run: bash scripts/test-gtk-mysql-approval.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-postgres-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  duckdb:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: pin-revision
    name: Optional DuckDB driver and GTK feature
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: debian:testing
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config clang \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libssl-dev libsecret-1-dev libkrb5-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-duckdb
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Driver tests including offline extensions and flat files
        run: cargo test --locked -p tablepro-driver-duckdb
      - name: Build the GTK application with DuckDB
        run: cargo build --locked -p tablepro-app --features duckdb
      - name: Run app DuckDB value contracts
        run: cargo test --locked -p tablepro-app --features duckdb --lib value_contract_duckdb

  regression-gate:
    name: Linux regression gate
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - pin-revision
      - preflight
      - fast
      - gtk-safety
      - integration
      - b4-rollback
      - driver-tls
      - postgres-release
      - duckdb
      - current-stable-clippy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require every regression job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-jobs.py
