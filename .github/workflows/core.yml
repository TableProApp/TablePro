name: Core

# The shared Rust core on the platforms other than Linux it is built for, and its Swift bindings.
# CI calls it when the core suite changed; nightly.yml calls it with extended.
on:
  workflow_call:
    inputs:
      extended:
        description: Also run the Arm64 SSH tunnel tests through Windows' OpenSSH Server.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      extended:
        description: Also run the Arm64 SSH tunnel tests through Windows' OpenSSH Server.
        type: boolean
        default: true

permissions:
  contents: read

# The caches share the repository's 10 GB; line tables keep them about 30% smaller (build-linux.yml).
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Windows Arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          # Also builds the Swift bindings, so a core change takes one macOS runner rather than two.
          - name: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            # GSSAPI from the system's GSS framework, as the macOS app links it.
            features: tablepro-driver-mssql/kerberos
            swift: true
    runs-on: ${{ matrix.runner }}
    # DuckDB's C++ takes most of it, and MSVC builds it slowly.
    timeout-minutes: 150
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
      RUSTFLAGS: -D warnings
      # aws-lc-sys assembles x64 with NASM, which the Windows runner lacks;
      # its prebuilt objects stand in.
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # The SSH transport the Windows app runs (core ADR 0009).
      IN_PROCESS_SSH: tablepro-ssh/in-process,tablepro-session/in-process-ssh
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      # Saved from main only: a pull request's cache serves that pull request alone and pushes main's out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache restores DuckDB's unpacked sources as empty folders, which its build script cannot unpack over.
      - name: Drop the emptied DuckDB sources
        run: rm -rf "target/$TARGET/duckdb-sources"
      # Named packages: the workspace also holds the GTK app, which builds
      # on Linux alone.
      - name: Check the core crates
        run: |
          cargo check --locked --target "$TARGET" --features "$FEATURES" --features "$IN_PROCESS_SSH" \
            -p tablepro-core -p tablepro-net -p tablepro-storage -p tablepro-ssh -p tablepro-session \
            -p tablepro-foreign-import -p tablepro-ai -p tablepro-mcp -p tablepro-account -p tablepro-cli \
            -p tablepro-test-support -p tablepro-test-fixtures \
            -p tablepro-driver-cassandra -p tablepro-driver-clickhouse -p tablepro-driver-duckdb \
            -p tablepro-driver-mongodb -p tablepro-driver-mssql -p tablepro-driver-mysql \
            -p tablepro-driver-postgres -p tablepro-driver-redis -p tablepro-driver-sqlite
      # The SQL Server driver's own: integrated login differs on every platform.
      - name: Core unit tests
        run: cargo test --locked --target "$TARGET" --features "$FEATURES" -p tablepro-core -p tablepro-driver-mssql --lib
      # The transports and the drivers' relays each have a split per platform.
      - name: Transport unit tests
        run: |
          cargo test --locked --target "$TARGET" -p tablepro-driver-mysql -p tablepro-driver-mongodb \
            -p tablepro-driver-cassandra --lib
          # The rest of net's tests read how Linux handles a full listen backlog.
          cargo test --locked --target "$TARGET" -p tablepro-net --lib -- loopback private_
          cargo test --locked --target "$TARGET" --features tablepro-ssh/in-process -p tablepro-ssh --lib in_process
      # The sign-in's loopback listener and the token's file on each platform.
      - name: Account unit tests
        run: cargo test --locked --target "$TARGET" -p tablepro-account --lib
      # The Arm64 image has no OpenSSH Server, and installing it takes about 20 minutes, so Arm64 runs these nightly.
      - name: Start Windows' OpenSSH Server
        id: sshd
        if: runner.os == 'Windows' && (matrix.name == 'Windows x64' || inputs.extended)
        shell: pwsh
        run: scripts/ci/start-windows-sshd.ps1 -Out (Join-Path $env:RUNNER_TEMP 'tablepro-ssh')
      - name: SSH tunnels through Windows' OpenSSH Server
        if: steps.sshd.outcome == 'success'
        # One login at a time: the Arm64 runner is slow to start each session's process.
        run: cargo test --locked --target "$TARGET" --features tablepro-ssh/in-process -p tablepro-ssh --test in_process_windows -- --ignored --test-threads=1
      - name: The OpenSSH Server's log
        if: failure() && steps.sshd.outcome != 'skipped' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:ProgramData 'ssh\sshd_config') | Where-Object { $_ -notmatch '^\s*(#|$)' }
          Get-Content (Join-Path $env:ProgramData 'ssh\logs\sshd.log') -Tail 300 -ErrorAction Continue
      # Each importer reads its app's files from this platform's own places.
      - name: Importers from other apps
        run: cargo test --locked --target "$TARGET" -p tablepro-foreign-import
      # Release with fat LTO, without the engines (core/docs/decisions/0010-macos-on-the-core.md).
      - name: Build the static library and its Swift bindings
        if: ${{ !cancelled() && matrix.swift }}
        run: apple/scripts/build-core.sh arm64
      - name: Swift binding tests
        if: ${{ !cancelled() && matrix.swift }}
        run: swift test --package-path apple/Packages/TableProFFI

  sql-server-windows:
    name: SQL Server integrated login (Windows x64)
    # SQL Server installs on x64 Windows only, and a runner is in no domain, so SSPI signs in with NTLM.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sql-server-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the SQL Server tests
        run: cargo test --locked -p tablepro-driver-mssql --test integration --no-run
      - name: Install SQL Server 2022 Express
        shell: pwsh
        run: core/crates/drivers/mssql/tests/windows/sql-server.ps1 -Install
      # A filter that matches nothing passes, so each run checks its count.
      - name: Integrated login over TDS 7.4 and strict TLS
        run: |
          cargo test --locked -p tablepro-driver-mssql --test integration -- --ignored windows_server::sspi:: 2>&1 | tee sspi.log
          grep "test result: ok. 2 passed" sspi.log
      - name: Turn on Force Strict Encryption
        shell: pwsh
        run: core/crates/drivers/mssql/tests/windows/sql-server.ps1 -ForceStrict
      - name: Integrated login under Force Strict Encryption
        run: |
          cargo test --locked -p tablepro-driver-mssql --test integration -- --ignored windows_server::force_strict:: 2>&1 | tee force-strict.log
          grep "test result: ok. 1 passed" force-strict.log
