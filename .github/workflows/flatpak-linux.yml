name: Flatpak Linux (packaging only)

on:
  push:
    branches: [main, linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/flatpak-linux.yml"
  pull_request:
    branches: [main, linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/flatpak-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    name: flatpak-builder (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["default"]' || '["default","development"]') }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: ${{ matrix.profile == 'development' && 'bookie-devel.flatpak' || 'bookie.flatpak' }}
          manifest-path: ${{ matrix.profile == 'development' && 'apps/linux/flatpak/com.tablepro.linux.Devel.json' || 'apps/linux/flatpak/com.tablepro.linux.json' }}
          cache-key: flatpak-builder-${{ matrix.profile }}-${{ hashFiles('apps/linux/flatpak/**') }}
          upload-artifact: true
      - name: Record packaging scope
        run: |
          echo "This workflow builds Flatpak packages. It does not run the regression or mutation suites." >> "$GITHUB_STEP_SUMMARY"
          echo "Check Build Linux and Linux test quality for the same commit: $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
