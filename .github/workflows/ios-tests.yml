name: iOS and Package Tests

on:
  workflow_call:
    inputs:
      oracle:
        description: Also run the TableProOracle package tests.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # TableProCore and TableProOracle run here under swift test, never in an Xcode test plan: a plan
  # target that depends on the package TableProPluginKit makes the app and plugins compile against
  # its module, not the framework.
  ios:
    name: iOS and Package Tests
    runs-on: xcode-27
    # The core's release build takes part of it when its cache is cold, and a runtime download part of the
    # simulator step's 20 minutes.
    timeout-minutes: 85
    env:
      SIMULATOR: iPhone 18 Pro
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-xcodegen

      - name: Download static libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-libs.sh

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: aarch64-apple-ios-sim

      # Saved from main only, like core.yml's: a pull request's cache serves that pull request alone.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: apple-core-ios-simulator
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The app links the core for the TablePro account, and SwiftPM resolves nothing until its binary target exists.
      - name: Build the shared core
        run: scripts/build-core.sh ios-simulator

      - name: Generate the Xcode project
        run: scripts/generate-project.sh ios

      - name: Restore Swift package checkouts
        id: spm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.spm-cache-ios
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apple/TableProMobile/TableProMobile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ios-${{ runner.os }}-

      # Built for no device, so the simulator is picked after the build. The prebuilt iOS libraries have arm64
      # simulator slices only, and a generic destination builds every architecture.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TableProMobile/TableProMobile.xcodeproj -scheme TableProMobile \
            -destination "generic/platform=iOS Simulator" -clonedSourcePackagesDirPath ~/.spm-cache-ios \
            -skipPackagePluginValidation -resultBundlePath Build.xcresult \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO COMPILATION_CACHE_ENABLE_CACHING=NO \
            | xcbeautify --renderer github-actions

      # The image can unmount a simulator runtime mid-job (actions/runner-images#14946). xcodebuild then finds
      # the device and fails to install on it, so the runtime is checked here, right before the tests. The
      # script stops at 15 minutes; the limit is for a hung simctl.
      - name: Boot a simulator the tests can install on
        id: simulator
        timeout-minutes: 20
        run: |
          udid="$(python3 scripts/ci/boot-ios-simulator.py "$SIMULATOR")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # One simulator, not clones: on a 3-core runner a second booted simulator killed runs with
      # "(ipc/mig) server died", and TableProMobileTests is one bundle that never split anyway.
      - name: Run the iOS tests
        id: tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project TableProMobile/TableProMobile.xcodeproj -scheme TableProMobile \
            -destination "id=$UDID" -only-testing:TableProMobileTests \
            -parallel-testing-enabled NO -clonedSourcePackagesDirPath ~/.spm-cache-ios \
            -skipPackagePluginValidation -resultBundlePath iOS.xcresult \
            | xcbeautify --renderer github-actions

      # Saved by a push or the nightly only: a cache saved on a pull request ref is visible to it alone.
      - name: Save Swift package checkouts
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.tests.outcome == 'success' && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.spm-cache-ios
          key: ${{ steps.spm.outputs.cache-primary-key }}

      # Only Xcode adds a new string to the catalog. A command-line build extracts it and moves on.
      # The widget extension has its own catalog.
      - name: Check the app's strings reach its catalogs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 scripts/localization.py extracted --target ios
          python3 scripts/localization.py extracted --target widget

      # --parallel is what makes swift test write the XCTest xunit file. Without it only the Swift
      # Testing one appears, and TableProOracle's cases are all XCTest.
      - name: Run the TableProCore package tests
        if: ${{ !cancelled() }}
        run: swift test --package-path Packages/TableProCore --parallel --xunit-output Core.xml

      # Pinned to the tracked Package.resolved, so a manifest bump that forgets the lockfile fails.
      - name: Run the TableProOracle package tests
        if: ${{ !cancelled() && inputs.oracle }}
        run: swift test --package-path Packages/TableProOracle --force-resolved-versions --parallel --xunit-output Oracle.xml

      # Fails the job when a bundle or a package ran zero tests, which both tools report as success.
      - name: Summarize the results
        if: ${{ !cancelled() }}
        run: scripts/ci/summarize-xcresult.sh Build.xcresult iOS.xcresult Core.xml Oracle.xml

      - name: Upload the result bundles
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-tests-${{ github.run_attempt }}
          path: apple/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
