name: Linux CI contracts

on:
  push:
    branches: [linux, main]
    paths: [".github/workflows/**", ".github/actions/**", "scripts/**", "apps/linux/packaging/**", "docs/**", "**.md"]
  pull_request:
    branches: [linux, main]
    paths: [".github/workflows/**", ".github/actions/**", "scripts/**", "apps/linux/packaging/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Go for pinned workflow validator
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.25.0
      - name: Install pinned workflow validator
        env:
          GOTOOLCHAIN: go1.25.12
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate Linux workflows and embedded shell
        run: |
          actionlint_bin="$(go env GOPATH)/bin"
          export PATH="$actionlint_bin:$PATH"
          python3 scripts/run-test-layer.py workflow-lint
      - name: Retain workflow diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error
  workflow-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.30.1
      - name: Audit the workflows for injection, permission and credential risks
        # Offline, so the verdict depends on these files alone. Low-confidence
        # findings are left out to keep the check free of false positives.
        run: zizmor --offline --format=github --min-severity=medium --min-confidence=medium .github/workflows
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - name: Fetch locked application dependencies
        run: cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
      - name: Install gettext tools for generated catalog checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext
      - name: Test runner failures and workflow contracts
        run: python3 scripts/run-test-layer.py harness packaging-contracts
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ci-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error
