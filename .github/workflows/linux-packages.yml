name: Linux packages

# Builds the Ubuntu and Fedora packages from the release source tarballs.
# The Debian source package is built once for each Ubuntu series the PPA
# builds for, and its binaries are built from it the way Launchpad builds
# them: offline, in a fresh container with only the declared build
# dependencies, then checked with lintian. The .rpm is built in a fresh
# fedora:44 with only its BuildRequires. Each package is then installed in
# another fresh container with only its runtime dependencies and started.
# The Flatpak bundle a release carries is built offline from the same
# tarballs with the release manifest, on the nightly and when asked for,
# and installed in fresh Ubuntu 22.04, 24.04 and 26.04 containers that have
# only their own Flatpak.
# release-linux.yml calls this workflow and uploads the source packages.
# A run by hand can add arm64, which the nightly and pull requests leave out.
# Given a release tag, it packages that release's tarballs instead, with
# the packaging from this checkout, for a PPA upload with a new revision.

on:
  pull_request:
    paths:
      - "linux/build-aux/debian/**"
      - "linux/build-aux/rpm/**"
      - "linux/build-aux/packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "linux/meson.build"
      - "linux/meson.options"
      - "linux/crates/**/meson.build"
      - "linux/data/**/meson.build"
      - "linux/po/meson.build"
      - "linux/po/LINGUAS"
      - ".github/workflows/linux-packages.yml"
  # Nightly on main, so a failure only one distribution's build shows turns
  # up before tag time. Three hours after build-linux.yml's nightly, so the
  # two do not share the account's 20 concurrent jobs.
  schedule:
    - cron: "13 17 * * *"
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build, test and install the arm64 .deb and .rpm
        type: boolean
        default: false
      flatpak:
        description: Also build the Flatpak bundle and install it
        type: boolean
        default: false
  workflow_call:
    inputs:
      deb-runners:
        description: JSON list of runners; each series' .deb is built once per runner architecture.
        type: string
        default: '["ubuntu-24.04"]'
      rpm-runners:
        description: JSON list of runners; the .rpm is built once per runner architecture.
        type: string
        default: '["ubuntu-24.04"]'
      release-tag:
        description: A published linux-vX.Y.Z whose tarballs are packaged, with the .deb packaging from this checkout. No .rpm is built.
        type: string
        default: ""
      revision:
        description: The PPA upload number, the N in X.Y.Z-0ppaN.
        type: string
        default: "1"
      flatpak:
        description: Also build the Flatpak bundle, once per rpm-runners architecture, and install it.
        type: boolean
        default: false

# A pull request keeps only its newest run; every other run, a release's call included, has its own group.
concurrency:
  group: linux-packages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, inputs.release-tag) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sources:
    name: Source tarballs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
    steps:
      # Before the checkout: without git, actions/checkout downloads a
      # tarball, which leaves no .git for make-dist.sh to archive.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the source and vendor tarballs
        if: inputs.release-tag == ''
        run: linux/build-aux/packaging/make-sources.sh --install-deps _packages/sources
      - name: Download the released source and vendor tarballs
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
        run: linux/build-aux/packaging/fetch-release-sources.sh --install-deps "$GITHUB_REPOSITORY" "$TAG" _packages/sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-sources
          path: _packages/sources
          if-no-files-found: error

  source-package:
    name: Debian source packages
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
    env:
      # Every Ubuntu series the PPA builds for.
      UBUNTU_SERIES: resolute stonking
    outputs:
      series: ${{ steps.build.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-sources
          path: _packages/sources
      - name: Build an unsigned source package for each series
        id: build
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          REVISION: ${{ inputs.revision || '1' }}
        run: |
          dist="$(find _packages/sources -name 'tablepro-*.tar.xz' ! -name '*-vendor.tar.xz')"
          vendor="$(find _packages/sources -name 'tablepro-*-vendor.tar.xz')"
          set -- --revision "$REVISION"
          if [ -n "$RELEASE_TAG" ]; then
            set -- "$@" --debian linux/build-aux/debian
          fi
          # shellcheck disable=SC2086 # one word per series
          linux/build-aux/packaging/build-source.sh --install-deps "$@" "$dist" "$vendor" _packages/source $UBUNTU_SERIES
          series=""
          for name in $UBUNTU_SERIES; do
            series="$series${series:+, }\"$name\""
          done
          echo "series=[$series]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-source-package
          path: _packages/source
          if-no-files-found: error

  # On the runner itself rather than in a job container, so build-deb.sh
  # can start the containers it builds in, the build one with no network.
  deb:
    name: Debian package (${{ matrix.series }}, ${{ matrix.runner }})
    needs: source-package
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.deb-runners || (inputs.arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]') || '["ubuntu-24.04"]') }}
        series: ${{ fromJSON(needs.source-package.outputs.series) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-source-package
          path: _packages/source
      - name: Build offline, test and lint the package
        env:
          SERIES: ${{ matrix.series }}
        run: |
          changes="$(grep -l -x "Distribution: $SERIES" _packages/source/*_source.changes)"
          linux/build-aux/packaging/build-deb.sh "${changes%_source.changes}.dsc" _packages/deb
      - name: Keep the Meson test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb-testlog-${{ matrix.series }}-${{ runner.arch }}
          path: _packages/deb/testlog.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Install, start and validate in a fresh container
        env:
          SERIES: ${{ matrix.series }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -- "$(find _packages/deb -name 'tablepro_*.deb')"
          # A published release's tarballs may ship other languages than
          # this checkout's LINGUAS names.
          if [ -z "$RELEASE_TAG" ]; then
            set -- "$@" linux/po/LINGUAS
          fi
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "ubuntu:$SERIES" \
            linux/build-aux/packaging/smoke-test.sh "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb-${{ matrix.series }}-${{ runner.arch }}
          path: _packages/deb
          if-no-files-found: error

  rpm:
    name: RPM package (${{ matrix.runner }})
    needs: sources
    if: inputs.release-tag == ''
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.rpm-runners || (inputs.arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]') || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-sources
          path: _packages/sources
      - name: Build, test and lint the package
        run: |
          dist="$(find _packages/sources -name 'tablepro-*.tar.xz' ! -name '*-vendor.tar.xz')"
          vendor="$(find _packages/sources -name 'tablepro-*-vendor.tar.xz')"
          linux/build-aux/packaging/build-rpm.sh "$dist" "$vendor" _packages/rpm
      - name: Keep the RPM failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm-testlog-${{ runner.arch }}
          path: |
            _packages/rpm/testlog.txt
            _packages/rpm/disk-usage.tsv
            _packages/rpm/disk-usage.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm-${{ runner.arch }}
          path: _packages/rpm
          if-no-files-found: error

  rpm-install:
    name: Install the RPM package (${{ matrix.runner }})
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.rpm-runners || (inputs.arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]') || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-rpm-${{ runner.arch }}
          path: _packages/rpm
      - name: Install, start and validate
        run: |
          linux/build-aux/packaging/smoke-test.sh \
            "$(find _packages/rpm -name 'tablepro-[0-9]*.rpm' ! -name '*.src.rpm')" linux/po/LINGUAS

  # From the same tarballs as the packages, offline (build-flatpak.sh).
  flatpak:
    name: Flatpak bundle (${{ matrix.runner }})
    needs: sources
    if: inputs.flatpak || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.rpm-runners || (inputs.arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]') || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-sources
          path: _packages/sources
      - name: Build and bundle
        run: |
          linux/build-aux/packaging/build-flatpak.sh \
            "$(find _packages/sources -name 'tablepro-*.tar.xz' ! -name '*-vendor.tar.xz')" \
            "$(find _packages/sources -name 'tablepro-*-vendor.tar.xz')" _packages/flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak-${{ runner.arch }}
          path: _packages/flatpak/tablepro-*.flatpak
          if-no-files-found: error
      - name: Lint the manifest
        if: runner.arch == 'X64'
        run: flatpak-builder-lint manifest linux/build-aux/flatpak/app.tablepro.TablePro.json

  # Also on the Ubuntu releases below the GNOME 50 floor, whose users have the
  # bundle and not the packages, each with its own Flatpak.
  flatpak-install:
    name: Install the Flatpak bundle (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.runner }})
    needs: flatpak
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.rpm-runners || (inputs.arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]') || '["ubuntu-24.04"]') }}
        ubuntu: ["22.04", "24.04", "26.04"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-flatpak-${{ runner.arch }}
          path: _packages/flatpak
      - name: Install, start and validate
        run: |
          linux/build-aux/packaging/smoke-test-flatpak.sh \
            "$(find _packages/flatpak -name 'tablepro-*.flatpak')" linux/po/LINGUAS
