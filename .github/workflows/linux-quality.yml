name: Linux test quality

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to measure."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-quality-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'linux') || github.sha }}
      - name: Resolve the tested commit once
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mutation:
    needs: resolve-ref
    name: Mutation (${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {label: core-1, package: tablepro-core, shard: 0/4}
          - {label: core-2, package: tablepro-core, shard: 1/4}
          - {label: core-3, package: tablepro-core, shard: 2/4}
          - {label: core-4, package: tablepro-core, shard: 3/4}
          - {label: policy-1, package: tablepro-policy, shard: 0/2}
          - {label: policy-2, package: tablepro-policy, shard: 1/2}
          - {label: ssh, package: tablepro-ssh, shard: 0/1}
          - {label: redis, package: tablepro-driver-redis, shard: 0/1}
          - {label: postgres, package: tablepro-driver-postgres, shard: 0/1}
    env:
      MUTATION_LABEL: ${{ matrix.label }}
      MUTATION_PACKAGE: ${{ matrix.package }}
      MUTATION_SHARD: ${{ matrix.shard }}
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-ref.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-mutants-${{ matrix.label }}
      - name: Install cargo-mutants
        id: mutation-tool
        run: cargo install cargo-mutants --locked --version ^27
      - name: Run mutations
        id: mutate
        timeout-minutes: 90
        run: |
          args=(--package "$MUTATION_PACKAGE" --test-tool cargo --shard "$MUTATION_SHARD"
                --output "mutants-$MUTATION_LABEL" --timeout 60 --build-timeout 900 --no-shuffle)
          if [[ "$MUTATION_PACKAGE" == tablepro-driver-postgres ]]; then
            cargo mutants "${args[@]}" \
              --file crates/drivers/postgres/src/array.rs \
              --file crates/drivers/postgres/src/numeric.rs \
              --file crates/drivers/postgres/src/temporal.rs \
              --file crates/drivers/postgres/src/decode.rs \
              -- --lib
          else
            cargo mutants "${args[@]}" -- --lib
          fi
      - name: Summarise surviving mutants
        if: always()
        run: |
          missing=0
          {
            echo "### Surviving mutants"
            echo
            echo "A surviving mutant is a change to the code that no test noticed."
            echo "Some are equivalent to the original and can never be caught; the"
            echo "rest are behaviour with no test behind it."
            echo "Measurement step outcome: ${{ steps.mutate.outcome }}"
            echo "A failed measurement can mean surviving mutants, timeouts, or infrastructure failure; inspect its logs."
            crate="$MUTATION_LABEL"
            report="mutants-$crate/mutants.out"
            caught="$report/caught.txt"
            missed="$report/missed.txt"
            timeout="$report/timeout.txt"
            unviable="$report/unviable.txt"
            echo
            echo "#### tablepro-$crate"
            echo
            if [[ ! -f "$caught" || ! -f "$missed" || ! -f "$timeout" || ! -f "$unviable" ]]; then
              echo "Measurement unavailable: missing report files; inspect the step log."
              missing=1
            else
              if [[ ! -s "$caught" && ! -s "$missed" && ! -s "$timeout" ]]; then
                echo "Measurement unavailable: no viable mutations were tested."
                missing=1
              fi
              printf 'caught: %s, missed: %s, timeout: %s, unviable: %s\n' \
                "$(wc -l <"$caught")" "$(wc -l <"$missed")" \
                "$(wc -l <"$timeout")" "$(wc -l <"$unviable")"
              if [[ -s "$missed" ]]; then
                echo
                echo '```'
                cat "$missed"
                echo '```'
              fi
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$missing"
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mutants-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants-${{ matrix.label }}
          if-no-files-found: error

  coverage:
    needs: resolve-ref
    name: Coverage (non-GTK crates)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-ref.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev libsqlite3-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # The unit and sandbox tiers only. Driver, TLS, release and GTK
      # tiers need Docker, a network fixture or a display, so including
      # them would make the number depend on the runner rather than on
      # the tests.
      - name: Measure
        run: |
          cargo llvm-cov --no-report --workspace \
            --exclude tablepro-driver-duckdb --exclude tablepro-app \
            --lib --bins --tests
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
      - name: Publish the summary
        if: always()
        run: |
          {
            echo "### Coverage, unit and sandbox tiers"
            echo
            echo "Excludes the GTK app crate, and the driver, TLS, release and"
            echo "installed-GTK tiers, which need Docker or a display."
            echo
            echo '```'
            cat coverage.txt || echo "no report produced"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-${{ github.run_id }}
          path: lcov.info
          if-no-files-found: error
