name: Linux Security

on:
  push:
    branches: [linux, main]
    paths: ["**", ".github/workflows/linux-security.yml", "!docs/**", "!**.md"]
  pull_request:
    branches: [linux, main]
    paths: ["**", ".github/workflows/linux-security.yml", "!docs/**", "!**.md"]
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to verify; empty uses the event commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-security-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  resolve-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'linux') || github.sha }}
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  security:
    needs: resolve-ref
    name: Security (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        layer: [security-policy, supply-chain]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-ref.outputs.commit }}
      - name: Install non-GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev libsqlite3-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-security-${{ matrix.layer }}
      - name: Install supply-chain tools
        if: matrix.layer == 'supply-chain'
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.2
      - name: Run security layer
        env:
          VALIDATION_LAYER: ${{ matrix.layer }}
        run: python3 scripts/run-test-layer.py "$VALIDATION_LAYER"
      - name: Retain security results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: security-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error
