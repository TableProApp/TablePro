name: PR Title

# A squash merge uses the title as the commit subject. synchronize is listed so every new head
# commit gets the check too, which a required check needs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checkout is the merge commit, so its first parent is the base the pull request lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: scripts

      - name: Check the title is a Conventional Commits subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/check-pr-title.py "$TITLE"

      # A version heading added outside a release PR makes version.py refuse its betas and notes.py assemble refuse it.
      - name: Check only a release pull request edits a CHANGELOG.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$TITLE" in 'chore(release)'*) exit 0 ;; esac
          edited="$(git diff --no-renames --name-only HEAD^1 HEAD -- apple/CHANGELOG.md linux/CHANGELOG.md)"
          if [ -n "$edited" ]; then
            echo "::error title=Changelog::Only a chore(release) pull request edits ${edited//$'\n'/ or }. Add a changelog.d/<PR>.<type>.md fragment instead."
            exit 1
          fi
