name: PR Title

# A squash merge uses the title as the commit subject. synchronize is listed so every new head
# commit gets the check too, which a required check needs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: scripts

      - name: Check the title is a Conventional Commits subject within 72 characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/check-pr-title.py "$TITLE"

      - name: Check CHANGELOG.md and the changelog fragments the pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/check-changelog.py --pr "$PR"

      # The checkout is the merge commit, so its first parent is the base the pull request lands on.
      - name: Check the added lines and the description against the banned words
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          status=0
          scripts/check-banned-words.sh --base HEAD^1 || status=1
          scripts/check-banned-words.sh "$RUNNER_TEMP/pr-body.md" || status=1
          exit "$status"
