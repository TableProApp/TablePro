name: PR Title

# A squash merge uses the title as the commit subject. Advisory on main, where CI is the only required check and the
# reviewer reads the subject; release/* still requires it. A title edit starts no CI run, so the changelog check runs
# here too. synchronize keeps a result on every head commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checkout is the merge commit, so its first parent is the base the pull request lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check the title is a Conventional Commits subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/check-pr-title.py "$TITLE"

      - name: Check only a release pull request edits a CHANGELOG.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/check-changelog-edits.sh HEAD^1 "$TITLE"
