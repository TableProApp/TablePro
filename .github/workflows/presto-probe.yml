name: Presto probe

on:
  push:
    branches: [feat/3598-presto-connections]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run -d --name tp-presto -p 8080:8080 prestodb/presto:latest
      - run: apple/scripts/probes/check-presto-protocol.sh 127.0.0.1 8080
      - if: always()
        run: docker logs tp-presto 2>&1 | tail -40
