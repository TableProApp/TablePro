name: Release Build

# The Release configuration of the app and every registry plugin, universal and unsigned, packaged
# the way a tag packages it, so a packaging failure shows before the tag: nightly on main and on
# demand.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release Build
    runs-on: xcode-27
    timeout-minutes: 240
    # The tag's version settings run here first; 9999999 is the largest build at MAJOR 0 (apple/RELEASING.md, Versions).
    env:
      VERSION: 0.0.0-dev
      BUILD: "9999999"
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/prepare-build

      - name: Set up Go for the SAP HANA helper
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apple/Native/HanaBridge/go.mod
          cache: false

      # The Dameng and HANA targets copy these artifacts in and never build them.
      - name: Build the native bridges
        run: |
          scripts/build-dameng.sh both
          scripts/build-hana.sh both

      - name: Build the app
        id: app
        run: scripts/release/build.sh app --unsigned

      # Runs after an app failure too, so one run reports both.
      - name: Build the registry plugins
        id: plugins
        if: ${{ !cancelled() }}
        run: scripts/release/build.sh plugins --unsigned

      - name: Package the app
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: scripts/release/package.sh app --unsigned

      - name: Package the plugins
        if: ${{ !cancelled() && steps.plugins.outcome == 'success' }}
        run: scripts/release/package.sh plugins --unsigned

      - name: Upload the build logs
        # A timeout cancels the job; the log shows where xcodebuild was when it stopped.
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs-${{ github.run_attempt }}
          path: apple/build/release/logs
          if-no-files-found: ignore
          retention-days: 7
