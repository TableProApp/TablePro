name: Release Build

# The Release configuration of the app and every registry plugin, universal and unsigned, packaged
# the way a tag packages it, so a packaging failure shows before the tag: nightly on main, on every
# release branch push, and on demand.

on:
  push:
    branches: ['release/**']
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Where the build runs. github is the fallback while the self-hosted Mac is offline.
        type: choice
        options: [self-hosted, github]
        default: self-hosted

permissions:
  contents: read

jobs:
  changes:
    name: Changes (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A nightly diffs against the last nightly that ended green, built or skipped: main up to
      # that commit is covered. A push that creates a release branch builds the cut commit, which
      # the merge-base rule would skip.
      - name: Decide whether the Release build runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ github.event.created }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              run=true
              ;;
            schedule)
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-build.yml/runs?event=schedule&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')
              run=$(scripts/ci/detect-changed-paths.sh --base "$base" release)
              ;;
            *)
              if [ "$CREATED" = true ]; then
                run=true
              else
                run=$(scripts/ci/detect-changed-paths.sh --base "$BEFORE" release)
              fi
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Reads "not false" so a failed changes job builds instead of passing.
  build:
    name: Release Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    # A push or nightly has no input, so it reads the RELEASE_BUILD_RUNNER repository variable; unset is the Mac.
    runs-on: ${{ (inputs.runner || vars.RELEASE_BUILD_RUNNER) == 'github' && 'xcode-27' || fromJSON('["self-hosted", "macOS", "ARM64", "tablepro-release"]') }}
    timeout-minutes: 150
    # The tag's version settings run here first; 9999999 is the largest build at MAJOR 0 (RELEASING.md, Versions).
    env:
      VERSION: 0.0.0-dev
      BUILD: "9999999"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/prepare-build

      - name: Set up Go for the SAP HANA helper
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Native/HanaBridge/go.mod
          cache: false

      # The Dameng and HANA targets copy these artifacts in and never build them.
      - name: Build the native bridges
        run: |
          scripts/build-dameng.sh both
          scripts/build-hana.sh both

      - name: Build the app
        id: app
        run: scripts/release/build.sh app --unsigned

      # Runs after an app failure too, so one run reports both.
      - name: Build the registry plugins
        id: plugins
        if: ${{ !cancelled() }}
        run: scripts/release/build.sh plugins --unsigned

      - name: Package the app
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: scripts/release/package.sh app --unsigned

      - name: Package the plugins
        if: ${{ !cancelled() && steps.plugins.outcome == 'success' }}
        run: scripts/release/package.sh plugins --unsigned

      - name: Upload the build logs
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs-${{ github.run_attempt }}
          path: build/release/logs
          if-no-files-found: ignore
          retention-days: 7
