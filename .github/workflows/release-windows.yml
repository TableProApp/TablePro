name: Release Windows

# A windows-vX.Y.Z or windows-vX.Y.Z-beta.N tag publishes TablePro for Windows: the x64 and arm64 zips with the
# per-user install script, the MSIX packages and the bundle, on a GitHub release (a prerelease for a beta), then
# adds the release to the update feed and the App Installer files on gh-pages and deploys them to
# updates.tablepro.app/windows/. windows/README.md, Releasing, has the steps.
#
# Environment windows-release, limited to windows-v* tags, holds the signing secrets. Without them everything
# still builds and publishes, unsigned, and the log says so.
# WINDOWS_CERTIFICATE: the code signing certificate with its private key, a .pfx in base64.
# WINDOWS_CERTIFICATE_PASSWORD: the .pfx password.
# Variable WINDOWS_PUBLISHER: the MSIX Publisher, when it must differ from the certificate's subject as .NET prints it.
# Variable WINDOWS_BRANCH: the branch a release tag must be on, main when unset.
#
# The pages job deploys through the github-pages environment, which must allow windows-v* tags next to v*.

on:
  push:
    tags: ["windows-v*"]

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same rules as TablePro.Core.Updates.AppVersion and windows/packaging/common.ps1.
      - name: The tag names a release version on the release branch
        id: check
        env:
          TAG: ${{ github.ref_name }}
          WINDOWS_BRANCH: ${{ vars.WINDOWS_BRANCH || 'main' }}
        run: |
          version="${TAG#windows-v}"
          if ! [[ "$version" =~ ^([0-9]{1,5})\.([0-9]{1,5})\.([0-9]{1,5})(-beta\.([1-9]|[1-8][0-9]|9[0-8]))?$ ]]; then
            echo "::error::$TAG is not windows-vX.Y.Z or windows-vX.Y.Z-beta.N with N from 1 to 98"
            exit 1
          fi
          for part in "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"; do
            if [ "$((10#$part))" -gt 65535 ]; then
              echo "::error::$TAG has a part above 65535, which an MSIX version cannot hold"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor HEAD "origin/$WINDOWS_BRANCH"; then
            echo "::error::$GITHUB_SHA is not on $WINDOWS_BRANCH"
            exit 1
          fi
          previous="$(git tag -l 'windows-v*' --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)"
          {
            echo "version=$version"
            if [ -n "${BASH_REMATCH[4]}" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: windows-2025
    environment: windows-release
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Import the signing certificate
        id: certificate
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./windows/packaging/import-certificate.ps1

      - name: Build the zip and the MSIX
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          ./windows/packaging/build-release.ps1 -Version $env:VERSION -Architecture $env:ARCH `
            -OutputDirectory release -CertificateThumbprint $env:THUMBPRINT -Publisher $env:PUBLISHER

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Remove the signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -ErrorAction SilentlyContinue

  publish:
    name: GitHub release
    needs: [verify, build]
    runs-on: windows-2025
    environment: windows-release
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: release
          merge-multiple: true

      - name: Import the signing certificate
        id: certificate
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./windows/packaging/import-certificate.ps1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      # makeappx and signtool come from the Windows SDK build tools package the app restores.
      - name: Restore the Windows SDK build tools
        run: dotnet restore windows/src/TablePro.App/TablePro.App.csproj

      - name: Bundle the MSIX packages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: ./windows/packaging/bundle-msix.ps1 -Version $env:VERSION -Directory release -CertificateThumbprint $env:THUMBPRINT

      - name: Fill the winget manifests
        if: needs.verify.outputs.prerelease == 'false' && steps.certificate.outputs.thumbprint != ''
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          ./windows/packaging/winget-manifest.ps1 -Version $env:VERSION -AssetDirectory release -OutputDirectory winget `
            -DownloadBaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.verify.outputs.prerelease == 'false' && steps.certificate.outputs.thumbprint != ''
        with:
          name: winget-manifests
          path: winget
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          PREVIOUS: ${{ needs.verify.outputs.previous }}
        run: |
          Push-Location release
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM SHA256SUMS
          Pop-Location
          $flags = @('--verify-tag', '--latest=false', '--generate-notes', '--title', "TablePro for Windows $env:VERSION")
          if ($env:PREVIOUS) { $flags += @('--notes-start-tag', $env:PREVIOUS) }
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          # The repository's latest release stays the macOS one.
          gh release create $env:TAG (Get-ChildItem release -File).FullName --repo $env:GITHUB_REPOSITORY @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Remove the signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -ErrorAction SilentlyContinue

  feed:
    name: Update feed
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      queue: max
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: build/gh-pages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: release
          merge-multiple: true

      # The in-app notes are the release's own, as GitHub generated them.
      - name: Add the release to the feed and the App Installer files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body | Set-Content -Encoding utf8NoBOM notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed with exit code $LASTEXITCODE." }
          ./windows/packaging/update-feed.ps1 -Version $env:VERSION -AssetDirectory release -SiteDirectory build/gh-pages/windows `
            -DownloadBaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG" `
            -ReleaseNotesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG" -NotesFile notes.md

      - name: Push gh-pages
        working-directory: build/gh-pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release: $env:TAG"
            git push origin HEAD:gh-pages
            if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE." }
          }

  pages:
    name: Pages
    needs: feed
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
