name: Release

# A v* tag builds, signs and notarizes the app and every registry plugin, publishes the GitHub
# release, then adds it to the feeds branch and deploys that to updates.tablepro.app.

on:
  push:
    tags: ['v*']

# Never cancelled: the build jobs hold notary submissions, and every step after them is idempotent,
# so a re-run of the same tag finishes what the first run left.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      build: ${{ steps.parse.outputs.build }}
      channel: ${{ steps.parse.outputs.channel }}
      critical: ${{ steps.notes.outputs.critical }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.9
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
          update-environment: false

      - name: Install the release tooling
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$SETUP_PYTHON" -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install --quiet --disable-pip-version-check --require-hashes \
            -r scripts/release/requirements.txt

      - name: Check the tag can build
        run: '"$RUNNER_TEMP/release-venv/bin/python" scripts/release/version.py check "$TAG"'

      - name: Read the version
        id: parse
        run: |
          set -euo pipefail
          parsed="$("$RUNNER_TEMP/release-venv/bin/python" scripts/release/version.py parse "$TAG")"
          printf 'tag=%s\n%s\n' "$TAG" "$parsed" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/release-venv/bin/python"
          mkdir -p build/notes
          for kind in body feed lead; do
            "$python" scripts/release/notes.py "$kind" "$VERSION" > "build/notes/$kind.md"
          done
          critical="$("$python" scripts/release/notes.py critical "$VERSION")"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: build/notes
          if-no-files-found: error
          retention-days: 30

  app:
    name: App
    needs: verify
    runs-on: xcode-27
    environment: signing
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-xcode
        with:
          require-release: ${{ needs.verify.outputs.channel == 'stable' }}

      - name: Check the Production CloudKit schema
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          xcrun cktool save-token --type management --method file --force "$CLOUDKIT_MANAGEMENT_TOKEN"
          scripts/export-cloudkit-schema.sh --check

      - uses: ./.github/actions/setup-xcodegen

      - name: Download static libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-libs.sh

      - name: Write Secrets.xcconfig
        env:
          ANALYTICS_HMAC_SECRET: ${{ secrets.ANALYTICS_HMAC_SECRET }}
        run: printf 'ANALYTICS_HMAC_SECRET = %s\n' "$ANALYTICS_HMAC_SECRET" > Configs/Secrets.xcconfig

      - name: Generate the Xcode project
        run: scripts/generate-project.sh macos

      # macos-tests.yml saves this cache; a save in tag scope would be unreadable from other refs.
      - name: Restore Swift package checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('TablePro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - uses: ./.github/actions/apple-signing
        with:
          certificate-p12: ${{ secrets.CERTIFICATES_P12 }}
          certificate-password: ${{ secrets.CERTIFICATES_PASSWORD }}
          provisioning-profile: ${{ secrets.PROVISIONING_PROFILE }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8: ${{ secrets.ASC_KEY_P8 }}

      - name: Install create-dmg
        run: brew list create-dmg > /dev/null 2>&1 || brew install create-dmg

      - name: Build the app
        run: scripts/release/build.sh app

      - name: Notarize the app
        run: scripts/release/notarize.sh build/release/TablePro.app

      - name: Package the app
        run: scripts/release/package.sh app "$VERSION"

      - name: Notarize the disk image
        run: scripts/release/notarize.sh "dist/TablePro-$VERSION.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: dist/
          if-no-files-found: error
          retention-days: 30

  plugins:
    name: Plugins
    needs: verify
    runs-on: xcode-27
    environment: signing
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-xcode
        with:
          require-release: ${{ needs.verify.outputs.channel == 'stable' }}

      - uses: ./.github/actions/setup-xcodegen

      - name: Download static libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-libs.sh

      - name: Generate the Xcode project
        run: scripts/generate-project.sh macos

      - name: Restore Swift package checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('TablePro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Set up Go for the SAP HANA helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: Native/HanaBridge/go.mod
          cache: false

      # The Dameng and HANA targets copy these artifacts in and never build them.
      - name: Build the native bridges
        run: |
          scripts/build-dameng.sh both
          scripts/build-hana.sh both

      - uses: ./.github/actions/apple-signing
        with:
          certificate-p12: ${{ secrets.CERTIFICATES_P12 }}
          certificate-password: ${{ secrets.CERTIFICATES_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8: ${{ secrets.ASC_KEY_P8 }}

      - name: Build the registry plugins
        run: scripts/release/build.sh plugins

      - name: Notarize the plugins
        run: scripts/release/notarize.sh build/release/plugins/*.tableplugin

      - name: Package the plugins
        run: scripts/release/package.sh plugins "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugins
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub release
    needs: [verify, app, plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugins
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      # A published release is immutable, so every asset goes on the draft and is checked there first.
      - name: Draft the release
        id: draft
        run: python3 scripts/release/publish.py draft "$TAG" --notes notes/body.md dist/* >> "$GITHUB_OUTPUT"

      - name: Attest the assets
        if: steps.draft.outputs.state == 'draft'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        run: python3 scripts/release/publish.py release "$TAG"

  feed:
    name: Feed
    needs: [verify, github-release]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      BUILD: ${{ needs.verify.outputs.build }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      CRITICAL: ${{ needs.verify.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-sparkle

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      - name: Add the release to the feed and the plugin manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          flags=()
          [ "$CRITICAL" != true ] || flags+=(--critical)
          python3 scripts/release/feed.py add "$TAG" --build "$BUILD" --channel "$CHANNEL" \
            --notes notes/feed.md ${flags[@]+"${flags[@]}"}

  pages:
    name: Pages
    needs: feed
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  notify:
    name: Notify
    needs: [verify, pages]
    if: needs.verify.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: release
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      # Plain text: the lead goes out as written, with no parse_mode to escape for.
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          set -euo pipefail
          {
            printf 'TablePro %s\n' "$VERSION"
            if [ -s notes/lead.md ]; then
              printf '\n'
              cat notes/lead.md
            fi
            printf '\n%s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG"
          } > msg.txt
          topic=()
          [ -z "$TELEGRAM_TOPIC_ID" ] || topic=(--data-urlencode "message_thread_id=$TELEGRAM_TOPIC_ID")
          curl -fsS --retry 3 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode text@msg.txt ${topic[@]+"${topic[@]}"} \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
