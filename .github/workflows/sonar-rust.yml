name: Sonar Rust

on:
  push:
    branches: [linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/sonar-rust.yml"
  pull_request:
    branches: [linux]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/sonar-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  sonar:
    name: SonarScanner for Cargo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: sonar-rust

      - name: Install SonarScanner for Cargo
        run: cargo install cargo-sonar-scanner --locked --version 1.0.0

      - name: Run Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: cargo sonar-scanner
