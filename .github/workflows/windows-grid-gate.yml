name: Windows grid gate

# Dispatch only: most of an hour per runner, and hosted timings vary by job (windows/docs/decisions/0003, Gate).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Grid gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Arm64
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    env:
      RUSTFLAGS: -D warnings
      # aws-lc-sys assembles x64 with NASM, which the Windows runner lacks; its prebuilt objects stand in.
      AWS_LC_SYS_PREBUILT_NASM: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-grid-gate-${{ matrix.target }}
      # rust-cache keeps only Cargo's own artifacts, so DuckDB's unpacked sources come back as empty folders.
      - name: Drop the emptied DuckDB sources
        shell: bash
        run: rm -rf "target/$TARGET/duckdb-sources" target/duckdb-sources
      - name: Build the core with the release profile
        run: cargo build --locked --release -p tablepro-ffi --target $env:TARGET
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Run the gate
        env:
          ARCH: ${{ matrix.arch }}
        run: windows/tests/TablePro.DataGrid.Gate/ci/run-gate.ps1 -Arch $env:ARCH -Out "$env:RUNNER_TEMP\gate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grid-gate-${{ matrix.name }}
          path: ${{ runner.temp }}/gate
