name: Windows

# ci.yml calls it when the windows suite changed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNIFFI_BINDGEN_CS_TAG: v0.11.1+v0.31.0

jobs:
  test:
    name: Windows (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            app: true
            rid: win-x64
            platform: x64
          - name: Arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            app: true
            rid: win-arm64
            platform: ARM64
          # Also checks that the committed bindings match the library, and the Windows workflows.
          - name: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            bindings: true
            workflows: true
    runs-on: ${{ matrix.runner }}
    # DuckDB's C++ takes most of it, and MSVC builds it slowly.
    timeout-minutes: 150
    env:
      RUSTFLAGS: -D warnings
      # aws-lc-sys assembles x64 with NASM, which the Windows runner lacks; its prebuilt objects stand in.
      AWS_LC_SYS_PREBUILT_NASM: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.target }}
      # rust-cache restores DuckDB's unpacked sources as empty folders, which its build script cannot unpack over.
      - name: Drop the emptied DuckDB sources
        run: rm -rf "target/${{ matrix.target }}/duckdb-sources" target/duckdb-sources
      # windows/global.json takes the newest 10.0 SDK.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Start Windows' OpenSSH Server
        if: matrix.name == 'x64'
        shell: pwsh
        run: scripts/ci/start-windows-sshd.ps1 -Out (Join-Path $env:RUNNER_TEMP 'tablepro-ssh')
      - name: Prepare PostgreSQL for the SSH connection tests
        if: matrix.name == 'x64'
        shell: pwsh
        run: windows/ci/ssh-postgres.ps1
      - name: Test the interop library
        # The test build runs cargo for the core first (windows/AGENTS.md, Commands).
        working-directory: windows
        run: dotnet test --solution TablePro.slnx

      # The app and its UI tests build on Windows only (windows/AGENTS.md, Commands). The UI tests run the
      # Native AOT build that ships; CargoProfile=dev keeps the core the test step already built.
      - name: Publish the app with Native AOT
        if: matrix.app
        working-directory: windows
        run: |
          dotnet publish src/TablePro.App -c Release -r "${{ matrix.rid }}" -p:Platform="${{ matrix.platform }}" \
            -p:CargoProfile=dev -o "$RUNNER_TEMP/app"
          if [ -e "$RUNNER_TEMP/app/TablePro.dll" ]; then
            echo "::error::the publish holds TablePro.dll: the app was not compiled ahead of time"
            exit 1
          fi
          while IFS= read -r -d '' asset; do
            relative="${asset#src/TablePro.App/}"
            if ! cmp -s "$asset" "$RUNNER_TEMP/app/$relative"; then
              echo "::error::the published app is missing or changed $relative"
              exit 1
            fi
          done < <(git ls-files -z -- src/TablePro.App/Assets)
      # The Arm64 image opens its privacy settings window over the desktop, where it takes the tests' clicks.
      - name: Prepare the desktop
        if: matrix.app
        shell: pwsh
        run: |
          . windows/ci/desktop.ps1
          Clear-FirstLogon
          Start-WslWatch "$env:GITHUB_WORKSPACE/windows/tests/TablePro.App.UITests/TestResults/wsl-watch.log"
          Set-Display 1920 1080
          Set-DragFullWindows
      # A native crash can end the app before its managed exception handler writes crash.log.
      - name: Keep native crash dumps during UI tests
        if: matrix.app
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/crash-dumps"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TablePro.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $folder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
      - name: UI tests
        if: matrix.app
        working-directory: windows
        env:
          TABLEPRO_UI_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: TABLEPRO_APP="$RUNNER_TEMP/app/TablePro.exe" dotnet test --project tests/TablePro.App.UITests
      - name: Keep the screenshots
        if: always() && matrix.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-screenshots-${{ matrix.name }}
          path: screenshots
          if-no-files-found: ignore
      - name: Collect crash diagnostics
        if: failure() && matrix.app
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/crash-dumps"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'TablePro' } |
            Format-List TimeCreated, Id, Message | Out-File "$folder/events.txt"
          if (Get-ChildItem $folder -Filter '*.dmp') {
            Copy-Item "$env:RUNNER_TEMP/app/TablePro.exe" $folder
            Get-ChildItem windows/src/TablePro.App/bin -Recurse -Filter TablePro.pdb |
              Where-Object { $_.Directory.Name -eq 'native' } | Copy-Item -Destination $folder
          }
      - name: Keep crash diagnostics
        if: failure() && matrix.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-crashes-${{ matrix.name }}
          path: ${{ runner.temp }}/crash-dumps
          if-no-files-found: ignore
      - name: The OpenSSH Server's log
        if: failure() && matrix.name == 'x64'
        shell: pwsh
        run: Get-Content (Join-Path $env:ProgramData 'ssh\logs\sshd.log') -Tail 300 -ErrorAction Continue

      - name: Restore uniffi-bindgen-cs
        if: matrix.bindings
        id: bindgen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install uniffi-bindgen-cs
        if: matrix.bindings && steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: |
          cargo install uniffi-bindgen-cs --locked --root ~/.uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG"
      - name: Save uniffi-bindgen-cs
        if: matrix.bindings && steps.bindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniffi-bindgen-cs
          key: ${{ steps.bindgen-cache.outputs.cache-primary-key }}
      - name: The committed bindings match the library
        if: matrix.bindings
        working-directory: windows
        run: |
          dotnet msbuild src/TablePro.Interop -t:GenerateBindings -p:UniffiBindgenCs="$HOME/.uniffi-bindgen-cs/bin/uniffi-bindgen-cs"
          if [ -n "$(git status --porcelain -- src/TablePro.Interop/Generated)" ]; then
            git status --short -- src/TablePro.Interop/Generated
            echo "::error::the bindings in windows/src/TablePro.Interop/Generated are stale: run the GenerateBindings target and commit the result (windows/AGENTS.md, Bindings)"
            exit 1
          fi

      # The Linux workflows' supply chain checks run in build-linux.yml; these are the Windows ones.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: matrix.workflows
        with:
          tool: zizmor@1.30.1
      - name: The Windows workflows
        if: matrix.workflows
        # Offline, so the verdict depends on these files alone.
        run: |
          zizmor --offline --format=github --min-severity=medium \
            .github/workflows/windows.yml \
            .github/workflows/release-windows.yml \
            .github/workflows/windows-grid-gate.yml
