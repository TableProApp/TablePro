name: Windows

# ci.yml calls it when the windows suite changed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNIFFI_BINDGEN_CS_TAG: v0.11.1+v0.31.0

jobs:
  test:
    name: Windows (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Also checks that the committed bindings match the library.
          - name: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bindings: true
    runs-on: ${{ matrix.runner }}
    # DuckDB's C++ takes most of it, and MSVC builds it slowly.
    timeout-minutes: 150
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      # aws-lc-sys assembles x64 with NASM, which the Windows runner lacks; its prebuilt objects stand in.
      AWS_LC_SYS_PREBUILT_NASM: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: feat/core-driver-plugins
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.target }}
      # rust-cache restores DuckDB's unpacked sources as empty folders, which its build script cannot unpack over.
      - name: Drop the emptied DuckDB sources
        run: rm -rf "target/${{ matrix.target }}/duckdb-sources" target/duckdb-sources
      # windows/global.json takes the newest 10.0 SDK.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Linux core dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev libssl-dev
      - name: Restore uniffi-bindgen-cs
        if: matrix.bindings
        id: bindgen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install uniffi-bindgen-cs
        if: matrix.bindings && steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: |
          cargo install uniffi-bindgen-cs --locked --root ~/.uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG"
      - name: Save uniffi-bindgen-cs
        if: matrix.bindings && steps.bindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniffi-bindgen-cs
          key: ${{ steps.bindgen-cache.outputs.cache-primary-key }}
      - name: The committed bindings match the library
        if: matrix.bindings
        working-directory: windows
        run: |
          set +e
          "$GITHUB_WORKSPACE/.claude/skills/fix-issue/scripts/verify.sh" --root "$GITHUB_WORKSPACE" --platform windows --no-wait bindings
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ -z "$(git diff --name-only -- src/TablePro.Interop/Generated)" ]; then
            exit "$result"
          fi
      - name: Keep generated bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugins-generated-bindings
          path: windows/src/TablePro.Interop/Generated
      - name: Driver tests
        run: |
          .claude/skills/fix-issue/scripts/verify.sh --root "$GITHUB_WORKSPACE" --platform windows --no-wait core tablepro-driver-abi
          .claude/skills/fix-issue/scripts/verify.sh --root "$GITHUB_WORKSPACE" --platform windows --no-wait core tablepro-driver-host
          .claude/skills/fix-issue/scripts/verify.sh --root "$GITHUB_WORKSPACE" --platform windows --no-wait core tablepro-driver-sqlite-plugin
          .claude/skills/fix-issue/scripts/verify.sh --root "$GITHUB_WORKSPACE" --platform windows --no-wait core tablepro-ffi

      # The SQLite driver library the interop and UI tests install (core ADR 0004): one copy as built, one
      # signed with a throwaway certificate this runner trusts, whose subject the tests trust for drivers.
      - name: Build and sign the test driver
        if: matrix.app
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p tablepro-driver-sqlite-plugin --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Join-Path $env:GITHUB_WORKSPACE "target/$env:TARGET/debug/tablepro_driver_sqlite_plugin.dll"
          $folder = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'test-driver')
          $unsigned = Join-Path $folder 'unsigned.dll'
          $signed = Join-Path $folder 'signed.dll'
          Copy-Item $built $unsigned
          Copy-Item $built $signed
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=TablePro Test Driver Signing' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $public = Join-Path $folder 'signer.cer'
          Export-Certificate -Cert $certificate -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $signature = Set-AuthenticodeSignature -FilePath $signed -Certificate $certificate -HashAlgorithm SHA256
          if ($signature.Status -ne 'Valid') { throw "signing the test driver: $($signature.StatusMessage)" }
          $version = ((cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'tablepro-driver-sqlite-plugin').version
          "TABLEPRO_TEST_DRIVER=$signed" >> $env:GITHUB_ENV
          "TABLEPRO_TEST_DRIVER_UNSIGNED=$unsigned" >> $env:GITHUB_ENV
          "TABLEPRO_TEST_DRIVER_SIGNER=$($certificate.Subject)" >> $env:GITHUB_ENV
          "TABLEPRO_TEST_DRIVER_SIGNER_ISSUER=$($certificate.GetCertHashString('SHA256'))" >> $env:GITHUB_ENV
          "TABLEPRO_TEST_DRIVER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test the interop library
        # The test build runs cargo for the core first (windows/AGENTS.md, Commands).
        working-directory: windows
        run: dotnet test --solution TablePro.slnx --disable-build-servers

      # The app and its UI tests build on Windows only (windows/AGENTS.md, Commands).
      - name: Build the app
        if: matrix.app
        working-directory: windows
        run: dotnet build src/TablePro.App -r "${{ matrix.rid }}" -p:Platform="${{ matrix.platform }}"
      # The Arm64 image opens its privacy settings window over the desktop, where it takes the tests' clicks.
      - name: Prepare the desktop
        if: matrix.app
        shell: pwsh
        run: |
          . windows/ci/desktop.ps1
          Clear-FirstLogon
          Start-WslWatch "$env:GITHUB_WORKSPACE/windows/tests/TablePro.App.UITests/TestResults/wsl-watch.log"
          Set-Display 1920 1080
      - name: UI tests
        if: matrix.app
        working-directory: windows
        env:
          TABLEPRO_UI_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: |
          TABLEPRO_APP=$(find "$PWD/src/TablePro.App/bin" -name TablePro.exe | head -1)
          export TABLEPRO_APP
          dotnet test --project tests/TablePro.App.UITests
      - name: Keep the screenshots
        if: always() && matrix.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-screenshots-${{ matrix.name }}
          path: screenshots
          if-no-files-found: ignore
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugins-verification-logs
          path: .analysis/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
