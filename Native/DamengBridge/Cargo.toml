[workspace]

[package]
name = "tablepro-dameng-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib"]

# TablePro's fork of rarnu/rust-dameng, pinned by revision. The DM8 compatibility work
# lives there as reviewable commits on top of upstream c5120eb0, the same shape as the
# OracleNIO fork. Cargo.lock pins this rev, so --locked builds stay reproducible.
[dependencies.dameng]
git = "https://github.com/TableProApp/rust-dameng"
rev = "d7a374fe5257228dd3454c36ccbfe3e6bce7a107"

[dependencies.dameng-types]
git = "https://github.com/TableProApp/rust-dameng"
rev = "d7a374fe5257228dd3454c36ccbfe3e6bce7a107"

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
panic = "unwind"
strip = "symbols"
