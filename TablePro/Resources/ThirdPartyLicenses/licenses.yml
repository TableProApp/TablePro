# Open source libraries TablePro redistributes.
#
# Hand-maintained. ThirdPartyLicenseInventoryTests checks each version against the pin
# in scripts/build-*.sh or Package.resolved and fails when they disagree, because a
# version bump can change a license and that needs a person to re-read it.
#
# spdx: UNVERIFIED means the project publishes no license we could read. Those entries
# carry no license text and render as unresolved rather than being given a guess.
