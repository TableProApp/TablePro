name: TableProMobile

# TableProMobile.xcodeproj is generated from this file and is not in git.
# Run scripts/generate-project.sh; it generates both projects.
# Build settings shared with the macOS project live in ../Configs/.

options:
  minimumXcodeGenVersion: "2.46.0"
  projectFormat: xcode16_3
  defaultConfig: Release
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  transitivelyLinkDependencies: false
  localPackagesGroup: Packages
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ../Configs/Debug.xcconfig
  Release: ../Configs/Release.xcconfig

packages:
  TableProCore:
    path: ../Packages/TableProCore
  TableProOracle:
    path: ../Packages/TableProOracle
  # The shared Rust core, for the TablePro account (core ADR 0047). ../scripts/build-core.sh ios-simulator, or ios for a
  # device, builds its binary target first: SwiftPM resolves nothing here without it.
  TableProFFI:
    path: ../Packages/TableProFFI
  # Usage data (clients.md, iOS). The same pin as ../project.yml; a build sends it only with POSTHOG_PROJECT_KEY set.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.92.7

targets:

  TableProMobile:
    type: application
    platform: iOS
    sources:
      - path: TableProMobile
        excludes:
          - Info.plist
      # Live Activity and shared-store types the widget extension owns.
      - TableProWidget/Shared/QueryActivityAttributes.swift
      - TableProWidget/Shared/SharedConnectionStore.swift
      - TableProWidget/Shared/WidgetConnectionItem.swift
      # The sample database every app ships, opened from the empty connection list.
      - path: ../../core/resources/Chinook.sqlite
        buildPhase: resources
      # FreeTDS bridging the iOS build compiles directly; there is no plugin
      # bundle on iOS, so the driver links into the app.
      - ../Plugins/MSSQLDriverPlugin/FreeTDSConnection.swift
      - ../Plugins/MSSQLDriverPlugin/MSSQLLoginParameters.swift
      # Redis TLS setup the iOS driver shares with the macOS plugin.
      - ../Plugins/RedisDriverPlugin/RedisTLSOptions.swift
      - ../Plugins/RedisDriverPlugin/RedisTLSSession.swift
      # MySQL session character set and result decoding the iOS driver shares with the macOS plugin.
      - ../Plugins/MySQLDriverPlugin/DatabendResultShape.swift
      - ../Plugins/MySQLDriverPlugin/MariaDBCharacterSet.swift
      - ../Plugins/MySQLDriverPlugin/MariaDBFieldMetadata.swift
      - ../Plugins/MySQLDriverPlugin/MySQLColumnDecoding.swift
      - ../Plugins/MySQLDriverPlugin/MySQLConnectionEncoding.swift
      - ../Plugins/MySQLDriverPlugin/MySQLErrorText.swift
      - ../Plugins/MySQLDriverPlugin/MySQLForeignKeyClause.swift
      - ../Plugins/MySQLDriverPlugin/MySQLServerFlavor.swift
      # The read-only transaction statements, refusal codes and messages both apps run a Read-Only statement with.
      - ../Plugins/MySQLDriverPlugin/MySQLReadOnlyTransaction.swift
      - ../Plugins/PostgreSQLDriverPlugin/LibPQReadOnlyTransaction.swift
      # What a MySQL session holds that the read-only transaction would end, its table locks among them.
      - ../Plugins/MySQLDriverPlugin/MySQLSessionFootprint.swift
      - ../Plugins/MySQLDriverPlugin/MySQLDatabaseMoveScan.swift
      - ../Plugins/MySQLDriverPlugin/MySQLTemporaryTableNames.swift
      - ../Plugins/MySQLDriverPlugin/MySQLLexicalFeatures.swift
      # The socket key a Mac connection stores, so iOS refuses exactly what the Mac driver dials
      # through a socket.
      - ../Plugins/MySQLDriverPlugin/MySQLLocalSocket.swift
      - ../Plugins/Shared/PluginQueryTimeout.swift
      # The toolbar glyph rule both apps follow on and before the 26 releases.
      - ../TablePro/Core/Services/Infrastructure/Toolbar/ToolbarSymbols.swift
      # Animations that follow Reduce Motion, the same in both apps.
      - ../TablePro/Theme/MotionAccessibility.swift
      # The PostHog client and what it may collect, the same in both apps.
      - ../TablePro/Core/Services/Telemetry/PostHogTelemetryClient.swift
      # The account's adapter over the core, its Keychain host secrets and its sign-in sheet, the same in both apps.
      - ../TablePro/Core/Services/Account/Shared
      # What the core sync engine's status and pass reasons mean, the same in both apps.
      - ../TablePro/Core/Sync/Coordinator/SyncEngineRules.swift
      # The core engine's CloudKit transport and the Swift engine's metadata it imports and mirrors, the same in both apps.
      - ../TablePro/Core/Sync/Transport
      - ../TablePro/Core/Sync/LegacyMirror
      # The core sync engine's device store over the Keychain, the same in both apps.
      - ../TablePro/Core/Sync/DeviceStore
      # What a move between iCloud and TablePro Sync asks of the core's sync service, the same in both apps.
      - ../TablePro/Core/Sync/MoveEngine.swift
      # The ClickHouse plugin driver runs whole behind PluginBackedDriver, so every file of the plugin is compiled in.
      - path: ../Plugins/ClickHouseDriverPlugin
        excludes:
          - Info.plist
      # The Cloudflare D1 plugin driver runs whole behind PluginBackedDriver; the form and SQLBuilder read its principal class.
      - path: ../Plugins/CloudflareD1DriverPlugin
        excludes:
          - Info.plist
      - ../Plugins/Shared/PluginConnectTimeout.swift
      - ../Plugins/Shared/PluginRedirectRefusingDelegate.swift
      # The DuckDB plugin driver runs whole behind PluginBackedDriver; the iOS CDuckDB bridge stands in for the plugin's own.
      - path: ../Plugins/DuckDBDriverPlugin
        excludes:
          - Info.plist
          - CDuckDB/**
      # The SQLite plugin driver runs whole behind PluginBackedDriver on the SDK's SQLite. The agent that runs SQLite on an
      # SSH server stays on the Mac.
      - path: ../Plugins/SQLiteDriverPlugin
        excludes:
          - Info.plist
          - SQLiteAgentBackend.swift
          - SQLiteAgentProtocol.swift
      - ../Plugins/SharedSpill/PluginRowSpill.swift
      - ../Plugins/Shared/PluginRowBatcher.swift
      # The MongoDB plugin driver runs behind PluginBackedDriver too; the iOS CLibMongoc bridge stands in for the
      # plugin's own, and the principal class stays on the Mac.
      - path: ../Plugins/MongoDBDriverPlugin
        excludes:
          - Info.plist
          - MongoDBPlugin.swift
          - CLibMongoc/**
      # The Oracle plugin driver runs whole behind PluginBackedDriver. The routine debugger and the connection diagnostics
      # are Mac UI, so they stay on the Mac.
      - path: ../Plugins/OracleDriverPlugin
        excludes:
          - Info.plist
          - OraclePlugin+Diagnostics.swift
          - OraclePluginDriver+Debugging.swift
          - OracleRoutineDebugSession.swift
          - OracleDebugText.swift
      # The column default reading both apps show and the version floor that says which catalog
      # quotes its defaults.
      - ../Plugins/MySQLDriverPlugin/MySQLCatalogDefault.swift
      - ../Plugins/MySQLDriverPlugin/MySQLGeneratedColumnClassification.swift
      - ../Plugins/MySQLDriverPlugin/MySQLServerVersion.swift
      - ../Plugins/MySQLDriverPlugin/OceanBaseColumnDefaults.swift
      # Catalog reads the iOS PostgreSQL driver shares with the macOS plugin: the table listing,
      # the materialized view columns, the index list and the Redshift table and key reads. Plus
      # the single owner of the plugin's literal quoting that it builds its SQL with.
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLCatalogForeignKeys.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLIndexQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLMaterializedViewColumnSource.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLTableListing.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLTextArray.swift
      - ../Plugins/PostgreSQLDriverPlugin/RedshiftTableCatalog.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLObjectQueries.swift
      # libpq COPY handling the iOS PostgreSQL driver shares with the macOS plugin.
      - ../Plugins/PostgreSQLDriverPlugin/LibPQCopyState.swift
      - ../Plugins/PostgreSQLDriverPlugin/LibPQCopyIn.swift
      # The read-write BEGIN both platforms open a write transaction with.
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLTransactionStatement.swift
      # Data export and import: the format plugins both apps run, without the macOS option panes.
      - ../Plugins/Shared/PluginExportOutputBuffer.swift
      - ../Plugins/Shared/PluginExportSpelling.swift
      - ../Plugins/Shared/PluginNameSpellings.swift
      - ../Plugins/Shared/PluginHexText.swift
      - path: ../Plugins/CSVExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/JSONExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/SQLExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/XLSXExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/MarkdownExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/MQLExportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/CSVImportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/JSONImportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/XLSXImportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      - path: ../Plugins/SQLImportPlugin
        excludes:
          - Info.plist
          - "*OptionsView.swift"
      # The import write path and script text both apps share.
      - ../TablePro/Core/Transfer/Shared
      # Each engine's export catalog, CREATE TABLE writer and binding helpers, shared with the macOS plugin.
      - ../Plugins/MySQLDriverPlugin/MySQLExportCatalog.swift
      - ../Plugins/MySQLDriverPlugin/MySQLSessionScopePlan.swift
      - ../Plugins/MySQLDriverPlugin/MySQLForeignKeyCatalog.swift
      - ../Plugins/MySQLDriverPlugin/MySQLPrivilegeCatalog.swift
      - ../Plugins/MySQLDriverPlugin/MySQLCreateTableSQL.swift
      - ../Plugins/MySQLDriverPlugin/MySQLColumnDefinitionSQL.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLCatalogExport.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLCreateTableSQL.swift
      - ../Plugins/PostgreSQLDriverPlugin/RedshiftCatalogExport.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLSchemaQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/ColumnQueryShape.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLSequenceQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLSequenceReference.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLTableDDL.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLCommentStatements.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLRelationSQL.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLViewDefinition.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLForeignKeyQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLTypeDefinition.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLColumnTypeSpelling.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLSessionScopeSQL.swift
      - ../Plugins/PostgreSQLDriverPlugin/LibPQCellDecoding.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLPrincipalQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLVersionedStatements.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLColumnClauses.swift
      - ../Plugins/PostgreSQLDriverPlugin/PostgreSQLIndexClauses.swift
      - ../Plugins/PostgreSQLDriverPlugin/LibPQParameterBuffers.swift
      - ../Plugins/PostgreSQLDriverPlugin/RedshiftSchemaQueries.swift
      - ../Plugins/PostgreSQLDriverPlugin/RedshiftExternalSchemaQueries.swift
      - ../Plugins/MSSQLDriverPlugin/MSSQLExportCatalog.swift
      - ../Plugins/MSSQLDriverPlugin/MSSQLObjectQueries.swift
      - ../Plugins/MSSQLDriverPlugin/MSSQLTableDefinitionSQL.swift
      # The libssh2 half of the SSH transport, shared with the macOS app by file reference.
      # The C-free half is the TableProSSHTransport package target; these touch libssh2
      # and cannot be, because a manifest cannot express the slice-dependent header path the
      # iOS xcframework needs. Both CLibSSH2 shims declare the same module and the same four
      # tablepro_* wrappers, so `import CLibSSH2` resolves on either platform.
      - ../TablePro/Core/SSH/LibSSH2ChannelFree.swift
      - ../TablePro/Core/SSH/LibSSH2ChannelIO.swift
      - ../TablePro/Core/SSH/LibSSH2ForwardChannel.swift
      - ../TablePro/Core/SSH/LibSSH2JumpRelay.swift
      - ../TablePro/Core/SSH/LibSSH2Handshake.swift
      - ../TablePro/Core/SSH/SSHKeepAliveResult.swift
      # Shortcuts payload parsing and row planning, shared with the macOS app's App Intents.
      - ../TablePro/Core/Shortcuts/Shared
      # License texts behind the Acknowledgements screen, copied whole so each keeps the
      # texts/ path Acknowledgements.json names it by.
      - path: ../TablePro/Resources/ThirdPartyLicenses/texts
        type: folder
        buildPhase: resources
    configFiles:
      Debug: ../Configs/Version-iOS.xcconfig
      Release: ../Configs/Version-iOS.xcconfig
    dependencies:
      - target: TableProWidgetExtension
        embed: true
        codeSign: true
        removeHeaders: true
        copy:
          destination: plugins
      - package: TableProCore
        products:
          - TableProAutocomplete
          - TableProConnectionLibrary
          - TableProCoreTypes
          - TableProDatabase
          - TableProDuckDBCore
          - TableProGeometry
          - TableProGoogleCloud
          - TableProGzip
          - TableProHTTP
          - TableProImport
          - TableProJavaScriptText
          - TableProLogRedaction
          - TableProModels
          - TableProMSSQLCore
          - TableProMySQLCore
          - TableProNumberFormatting
          - TableProPluginKit
          - TableProPostgreSQLCore
          - TableProQuery
          - TableProRedisCore
          - TableProSQLFile
          - TableProSQLGrammar
          - TableProSQLiteCore
          - TableProSQLQuoting
          - TableProSQLVocabulary
          - TableProSSHTransport
          - TableProSyncTransport
          - TableProTabularIO
          - TableProTLSClientIdentity
          - TableProWireIO
      - package: TableProOracle
        product: TableProOracleCore
      - package: TableProFFI
      - package: PostHog
      - framework: ../Libs/ios/DuckDB.xcframework
        embed: false
      - framework: ../Libs/ios/FreeTDS.xcframework
        embed: false
      - framework: ../Libs/ios/Hiredis-SSL.xcframework
        embed: false
      - framework: ../Libs/ios/Hiredis.xcframework
        embed: false
      - framework: ../Libs/ios/LibPQ.xcframework
        embed: false
      - framework: ../Libs/ios/LibBson.xcframework
        embed: false
      - framework: ../Libs/ios/LibMongoc.xcframework
        embed: false
      - framework: ../Libs/ios/LibSSH2.xcframework
        embed: false
      - framework: ../Libs/ios/MariaDB.xcframework
        embed: false
      - framework: ../Libs/ios/OpenSSL-Crypto.xcframework
        embed: false
      - framework: ../Libs/ios/OpenSSL-SSL.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_ENTITLEMENTS: TableProMobile/TableProMobileRelease.entitlements
        DEVELOPMENT_TEAM: $(TABLEPRO_DEVELOPMENT_TEAM)
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TableProMobile/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TablePro
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -liconv
          - -lc++
          - -lresolv
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProMobile
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TableProMobile/CBridges/CMariaDB $(SRCROOT)/TableProMobile/CBridges/CLibPQ $(SRCROOT)/TableProMobile/CBridges/CRedis $(SRCROOT)/TableProMobile/CBridges/CLibSSH2 $(SRCROOT)/TableProMobile/CBridges/CFreeTDS $(SRCROOT)/TableProMobile/CBridges/CDuckDB $(SRCROOT)/TableProMobile/CBridges/CLibMongoc
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  TableProWidgetExtension:
    type: app-extension
    platform: iOS
    # The folder holds the widget's own Localizable.xcstrings, so the extension ships only its strings.
    sources:
      - path: TableProWidget
        excludes:
          - Info.plist
    configFiles:
      Debug: ../Configs/Version-iOS.xcconfig
      Release: ../Configs/Version-iOS.xcconfig
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: TableProWidgetExtension.entitlements
        DEVELOPMENT_TEAM: $(TABLEPRO_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TableProWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TableProWidget
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProMobile.Widget
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  TableProMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TableProMobileTests
    dependencies:
      - target: TableProMobile
      - package: TableProCore
        product: TableProTLSTestFixtures
      - package: TableProCore
        product: TableProTestSupport
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProMobileTests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TableProMobile/CBridges/CMariaDB $(SRCROOT)/TableProMobile/CBridges/CLibPQ $(SRCROOT)/TableProMobile/CBridges/CRedis $(SRCROOT)/TableProMobile/CBridges/CLibSSH2 $(SRCROOT)/TableProMobile/CBridges/CFreeTDS $(SRCROOT)/TableProMobile/CBridges/CDuckDB $(SRCROOT)/TableProMobile/CBridges/CLibMongoc
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  TableProMobile:
    build:
      targets:
        TableProMobile: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TableProMobileTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
