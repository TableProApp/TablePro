[package]
name = "tablepro-driver-sqlite-plugin"
# The driver's own version, which its descriptor carries and the registry lists.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The downloadable library. The app links tablepro-driver-sqlite itself, and a crate of its own keeps a
# workspace build from unifying the export into it (core/docs/decisions/0004-driver-plugin-abi.md).
[lib]
name = "tablepro_driver_sqlite_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
tablepro-driver-abi.workspace = true
tablepro-driver-sqlite.workspace = true

[dev-dependencies]
tablepro-driver-host.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
