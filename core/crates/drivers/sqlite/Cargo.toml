[package]
name = "tablepro-driver-sqlite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tablepro-core.workspace = true
async-trait.workspace = true
futures.workspace = true
# Two direct calls sqlx does not wrap: sqlite3_get_autocommit, until sqlx
# exposes the transaction state of a connection, and sqlite3_busy_handler.
# The workspace pin stays inside sqlx-sqlite's range, because only one
# libsqlite3-sys can be linked.
libsqlite3-sys.workspace = true
sqlparser.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

# Links the SQLite tablepro-storage links: the system's on Linux and Apple
# targets, the copy sqlx ships on Windows.
[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(any(target_os = "linux", target_vendor = "apple")))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
tablepro-test-support.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
