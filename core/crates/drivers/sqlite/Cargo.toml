[package]
name = "tablepro-driver-sqlite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tablepro-core.workspace = true
async-trait.workspace = true
futures.workspace = true
# Two direct calls sqlx does not wrap: sqlite3_get_autocommit, until sqlx
# exposes the transaction state of a connection, and sqlite3_busy_handler.
# The range follows sqlx-sqlite's own, because only one libsqlite3-sys can
# be linked.
libsqlite3-sys.workspace = true
sqlparser.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

# Linux links the distribution's SQLite, as tablepro-storage does; the
# other targets build the copy sqlx ships.
[target.'cfg(target_os = "linux")'.dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
tablepro-test-support.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
