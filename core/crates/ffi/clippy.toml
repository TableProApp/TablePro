allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# An error crosses as a UniFFI record, which cannot be boxed, and is built only once per failed call.
large-error-threshold = 256
enum-variant-size-threshold = 256

# Clippy reads only the nearest clippy.toml, so this repeats the root file's key-order rules for JSON.
disallowed-types = [
    { path = "serde_json::Map", reason = "key order is not preserved; keep JSON as JsonText" },
]

disallowed-methods = [
    { path = "serde_json::Value::as_object", reason = "key order is not preserved; keep JSON as JsonText" },
    { path = "serde_json::Value::as_object_mut", reason = "key order is not preserved; keep JSON as JsonText" },

    # A foreign thread has no ambient runtime, so every task goes on the library's own through Tasks.
    { path = "tokio::runtime::Handle::current", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::try_current", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::block_on", reason = "blocking a runtime thread deadlocks it; use spawn_blocking_task" },
    { path = "tokio::runtime::Runtime::enter", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::enter", reason = "take the handle from Tasks" },
    { path = "tokio::spawn", reason = "use Tasks::spawn_task" },
    { path = "tokio::task::spawn_blocking", reason = "use Tasks::spawn_blocking_task" },
    { path = "tokio::runtime::Handle::spawn", reason = "use Tasks::spawn_task" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use Tasks::spawn_blocking_task" },
]
