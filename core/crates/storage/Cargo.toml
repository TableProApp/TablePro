[package]
name = "tablepro-storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tablepro-core.workspace = true
async-trait.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros"] }
chrono.workspace = true
tempfile.workspace = true
tracing.workspace = true

# Linux links the distribution's SQLite, so its security fixes arrive
# through the distribution. Apple targets link the system's, the one the
# app opens its own files with: two copies in one process break each
# other's POSIX locks (core ADR 0010). Windows builds the copy sqlx ships.
[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite-unbundled"] }

[target.'cfg(not(any(target_os = "linux", target_vendor = "apple")))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
