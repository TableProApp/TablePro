[package]
name = "tablepro-app"
version = "0.1.6-dev"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tablepro_app"
path = "src/lib.rs"

[[bin]]
name = "tablepro-app"
path = "src/main.rs"

[features]
default = ["kerberos"]
kerberos = ["tablepro-driver-mssql/kerberos"]
# Bundled DuckDB compiles a large C++ tree; enable explicitly when needed.
duckdb = ["dep:tablepro-driver-duckdb"]

[dependencies]
tablepro-core = { path = "../core" }
tablepro-policy = { path = "../policy" }
tablepro-mcp = { path = "../mcp" }
tablepro-driver-clickhouse = { path = "../drivers/clickhouse" }
tablepro-driver-duckdb = { path = "../drivers/duckdb", optional = true }
tablepro-driver-mongodb = { path = "../drivers/mongodb" }
tablepro-driver-mssql = { path = "../drivers/mssql" }
tablepro-driver-mysql = { path = "../drivers/mysql" }
tablepro-driver-postgres = { path = "../drivers/postgres" }
tablepro-driver-redis = { path = "../drivers/redis" }
tablepro-driver-sqlite = { path = "../drivers/sqlite" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tablepro-ssh = { path = "../ssh" }
tablepro-storage = { path = "../storage" }
tablepro-transport = { path = "../transport" }
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
glib.workspace = true
relm4.workspace = true
secrecy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"
whoami = "2"
async-trait.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
testcontainers = { workspace = true, features = ["http_wait_plain"] }
testcontainers-modules = { workspace = true, features = ["mongo", "mysql", "postgres", "mssql_server", "redis"] }
mongodb = { version = "3.8", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }
sha2.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
