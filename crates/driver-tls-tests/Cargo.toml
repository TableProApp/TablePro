[package]
name = "tablepro-driver-tls-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tablepro_driver_tls_tests"
path = "src/lib.rs"

[features]
default = []
mssql-kerberos = ["tablepro-driver-mssql/kerberos"]

[[test]]
name = "mssql_kerberos"
path = "tests/mssql_kerberos.rs"
required-features = ["mssql-kerberos"]

[dependencies]
tablepro-core = { path = "../core" }
tablepro-ssh = { path = "../ssh" }
tablepro-transport = { path = "../transport" }
secrecy.workspace = true

[dev-dependencies]
tablepro-driver-clickhouse = { path = "../drivers/clickhouse" }
tablepro-driver-mongodb = { path = "../drivers/mongodb" }
tablepro-driver-mssql = { path = "../drivers/mssql" }
tablepro-driver-mysql = { path = "../drivers/mysql" }
tablepro-driver-postgres = { path = "../drivers/postgres" }
tablepro-driver-redis = { path = "../drivers/redis" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
