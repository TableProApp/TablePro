[package]
name = "tablepro-driver-clickhouse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_clickhouse"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
chrono.workspace = true
clickhouse.workspace = true
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jiff.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
http = "1"
secrecy.workspace = true
tempfile.workspace = true
testcontainers = { workspace = true, features = ["http_wait_plain"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
zip = { version = "8.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
