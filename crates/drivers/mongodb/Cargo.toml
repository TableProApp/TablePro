[package]
name = "tablepro-driver-mongodb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_mongodb"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
futures.workspace = true
mongodb = { version = "3.8", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
secrecy.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
tokio.workspace = true

[dev-dependencies]
chrono.workspace = true
csv.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mongo"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
