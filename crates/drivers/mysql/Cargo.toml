[package]
name = "tablepro-driver-mysql"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_mysql"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql", "tls-rustls-aws-lc-rs", "mysql-rsa"] }
sqlparser.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
secrecy.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mysql"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
zip = { version = "8.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
