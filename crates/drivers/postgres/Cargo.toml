[package]
name = "tablepro-driver-postgres"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_postgres"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "tls-rustls-aws-lc-rs"] }
sqlx-core = { workspace = true, features = ["rustls-native-certs"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
csv.workspace = true
secrecy.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
