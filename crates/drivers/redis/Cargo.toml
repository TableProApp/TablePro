[package]
name = "tablepro-driver-redis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_redis"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
redis = { version = "1.5", default-features = false, features = ["num-bigint", "tokio-comp", "connection-manager", "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp"] }
serde_json.workspace = true
secrecy.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }

[lints]
workspace = true
