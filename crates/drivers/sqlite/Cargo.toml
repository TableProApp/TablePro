[package]
name = "tablepro-driver-sqlite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_sqlite"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
