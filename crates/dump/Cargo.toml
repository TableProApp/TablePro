rust-version.workspace = true
publish = false

[lib]
name = "tablepro_dump"
path = "src/lib.rs"

[dependencies]
secrecy.workspace = true
tablepro-core = { path = "../core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "fs"] }
