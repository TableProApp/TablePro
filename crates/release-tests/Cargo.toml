[package]
name = "tablepro-release-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tablepro_release_tests"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../core" }
tablepro-policy = { path = "../policy" }
tablepro-ssh = { path = "../ssh" }
tablepro-transport = { path = "../transport" }
tablepro-driver-postgres = { path = "../drivers/postgres" }
tablepro-storage = { path = "../storage" }
tempfile.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tablepro-mcp = { path = "../mcp" }
async-trait.workspace = true
serde_json.workspace = true


[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
