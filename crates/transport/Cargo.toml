[package]
name = "tablepro-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tablepro_transport"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../core" }
tablepro-policy = { path = "../policy" }
tablepro-ssh = { path = "../ssh" }
tablepro-storage = { path = "../storage" }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
