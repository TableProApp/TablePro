# The rows of README.md, which scripts/feature-parity.py writes from this file. README.md explains
# the statuses. A value is a status, or a mapping of status, pr and note.

areas:
  - name: Connections
    features:
      - name: Saved connections, groups, favorites and tags
        linux: yes
        windows: yes
      - name: SSH tunnels with jump hosts
        linux: yes
        windows: {status: partial, note: "no jump hosts"}
      - name: Safe Mode per connection (off, confirm writes, read only)
        linux: yes
        windows: {status: partial, note: "Confirm Writes does not ask before a write"}
      - name: Import connections from other apps
        linux: yes
        windows: {status: no, note: "imports a TablePro JSON file only"}
      - name: Application menu with Quit
        linux: {status: yes, note: "a main menu, since GNOME apps have no menu bar; #4139 splits the session's commands into a menu of their own"}
        windows: yes
      - name: The server's other databases in the sidebar
        linux: {status: yes, note: "each opened from the sidebar's menu"}
        windows: no

  - name: Sidebar
    features:
      - name: Schemas and tables, with search
        linux: yes
        windows: yes
      - name: A schema's objects grouped by kind
        linux: {status: pending, pr: 4159}
        windows: yes
      - name: Width set by dragging its edge
        linux: {status: pending, pr: 4155}
        windows: yes
      - name: Toggle in the window header
        linux: yes
        windows: {status: partial, note: "View > Object Tree and Ctrl+B; no button in the title bar"}
      - name: Bottom bar with an Add menu
        linux: {status: pending, pr: 4146}
        windows: no
      - name: Choose which schemas the sidebar lists
        linux: {status: pending, pr: 4150}
        windows: no
      - name: Tables and Favorites scope switch
        linux: yes
        windows: no
      - name: Favorite folders
        linux: {status: pending, pr: 4130}
        windows: no
      - name: Favorite keywords that expand in the editor
        linux: no
        windows: no
      - name: Favorite tables and databases, with environments
        linux: no
        windows: no
      - name: Open Quickly (find a table by name)
        linux: {status: pending, pr: 4121, note: "tables and views; saved queries in #4133, past queries in #4144"}
        windows: {status: partial, note: "Ctrl+P moves to the sidebar's filter"}

  - name: Data grid
    features:
      - name: Virtualized grid with paging and an exact or estimated count
        linux: yes
        windows: yes
      - name: Alternate row shading
        linux: yes
        windows: no
      - name: Values in the monospace font
        linux: yes
        windows: no
      - name: Row numbers stay in view while scrolling sideways
        linux: yes
        windows: yes
      - name: Inline cell editing with pending changes, undo and redo
        linux: yes
        windows: no
      - name: Filters per column and as a WHERE fragment
        linux: yes
        windows: no
      - name: Open a referenced row and the rows that reference one
        linux: yes
        windows: no
      - name: Set Value on every selected row (Empty, NULL, DEFAULT, UUID, an expression, any value)
        linux: {status: partial, note: "Empty, NULL, DEFAULT and the engine's expressions"}
        windows: no
      - name: Show row numbers, row height and the text shown for NULL
        linux: yes
        windows: no
      - name: Highlight rules (color rows and cells by a condition)
        linux: {status: pending, pr: 4127, note: "kept per table in #4129"}
        windows: no
      - name: The grid in the editor theme's colors
        linux: {status: pending, pr: 4128}
        windows: no
      - name: Font of the grid's cells, and zoom
        linux: {status: pending, pr: 4135, note: "family and size; no zoom"}
        windows: no
      - name: Date format of the cells
        linux: {status: pending, pr: 4142}
        windows: no
      - name: Default sort of a table (none, primary key, first column)
        linux: {status: pending, pr: 4140}
        windows: no
      - name: The format Copy writes for several rows
        linux: {status: pending, pr: 4137}
        windows: {status: no, note: "copies tab-separated values only"}
      - name: Open the row details when a row is selected
        linux: {status: pending, pr: 4138}
        windows: no
      - name: Mark zero-width, control and special space characters in the value editor
        linux: {status: no, note: "#4141 marks spaces, tabs and line breaks instead"}
        windows: no

  - name: Bottom bar
    features:
      - name: Columns button
        linux: yes
        windows: no
      - name: Time a page or a query took
        linux: yes
        windows: yes
      - name: Data and Structure in one tab
        linux: yes
        windows: no
      - name: JSON view of the rows
        linux: {status: pending, pr: 4122, note: "table tabs; not query results"}
        windows: no
      - name: Chart view of a result
        linux: no
        windows: no
      - name: Map view of a result
        linux: no
        windows: no

  - name: Row details
    features:
      - name: Row details pane
        linux: yes
        windows: no
      - name: Type, key and edit marks on a field
        linux: yes
        windows: no
      - name: Foreign key mark on a field
        linux: {status: pending, pr: 4131}
        windows: no
      - name: Field search and an edited-only filter
        linux: yes
        windows: no
      - name: A field drawn as its name over its value
        linux: {status: pending, pr: 4156}
        windows: no
      - name: An editor inside each field row
        linux: {status: pending, pr: 4157}
        windows: no
      - name: A menu on each field
        linux: {status: pending, pr: 4158}
        windows: no
      - name: A row as JSON
        linux: {status: partial, note: "a dialog from the grid's menu, not a view of the row details"}
        windows: no

  - name: SQL editor
    features:
      - name: Highlighting, completion, snippets and formatting
        linux: yes
        windows: {status: partial, note: "highlighting only"}
      - name: Move a query tab to another database
        linux: yes
        windows: no
      - name: Color schemes
        linux: yes
        windows: no
      - name: Vim keybindings
        linux: yes
        windows: no

  - name: Structure and schema
    features:
      - name: Structure editor with a reviewed ALTER
        linux: yes
        windows: no
      - name: ER diagram
        linux: yes
        windows: no

  - name: History, import and export
    features:
      - name: Query history with search, pins and export
        linux: yes
        windows: no
      - name: Saved queries
        linux: yes
        windows: no
      - name: Export results (CSV, JSON, Markdown, HTML, XML, Excel, SQL)
        linux: yes
        windows: no
      - name: Export a database as SQL and import a SQL file
        linux: yes
        windows: no

  - name: Assistant, MCP, account and command line
    features:
      - name: AI assistant
        linux: yes
        windows: no
      - name: MCP server for outside clients
        linux: yes
        windows: no
      - name: TablePro account and entitlement
        linux: yes
        windows: no
      - name: The `tablepro` command line tool
        linux: {status: pending, pr: 4145}
        windows: {status: no, note: "`tablepro.exe` opens the app and reads no arguments"}

  - name: Window toolbar
    features:
      - name: Safe Mode level in the toolbar
        linux: {status: pending, pr: 4124}
        windows: no
      - name: Refresh button
        linux: yes
        windows: yes
      - name: Save Changes button
        linux: {status: pending, pr: 4126}
        windows: no
      - name: Connection and database chips
        linux: {status: partial, note: "the title names the connection and the sidebar lists every open connection and database; no chips"}
        windows: {status: partial, note: "the title bar names the connection; no database chip"}
      - name: Back and Forward through a tab's browse history
        linux: {status: na, note: "a referenced row opens in a new tab, where macOS moves the tab to it"}
        windows: no
      - name: Actions menu (Preview SQL, Show and Copy DDL, Users and Roles, Query Insights, Server Dashboard)
        linux: {status: partial, note: "Show CREATE TABLE is in the sidebar's menu; the rest is not built"}
        windows: no
      - name: Reconnect after a lost connection
        linux: yes
        windows: yes
