[test-groups]
postgres = { max-threads = 1 }
mysql = { max-threads = 1 }
mssql = { max-threads = 1 }
clickhouse = { max-threads = 1 }
ssh = { max-threads = 1 }
fixtures = { max-threads = 1 }
session = { max-threads = 1 }
app = { max-threads = 1 }

[profile.default]
# tiberius 0.13 stops reading at the first end of message, so an attention
# sent while SQL Server is still waiting is never acknowledged and the
# connection is dropped: https://github.com/tiberius-rs/tiberius/issues/459.
# Remove once a release has the fix.
default-filter = """
not (package(tablepro-driver-mssql) & (
    test(=cancellation::editor_waitfor_cancel_then_select1_same_client)
    | test(=cancellation::pooled_query_bound_waitfor_deadline_server_cancelled_client_reused)
    | test(=conformance_engine::suite::editor_cancel_reports_cancelled_and_session_stays_ready)
))
"""

[[profile.default.overrides]]
filter = 'package(tablepro-driver-postgres)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'package(tablepro-driver-mysql)'
test-group = 'mysql'

[[profile.default.overrides]]
filter = 'package(tablepro-driver-mssql)'
test-group = 'mssql'

[[profile.default.overrides]]
filter = 'package(tablepro-driver-clickhouse)'
test-group = 'clickhouse'

[[profile.default.overrides]]
filter = 'package(tablepro-ssh)'
test-group = 'ssh'

[[profile.default.overrides]]
filter = 'package(tablepro-test-fixtures)'
test-group = 'fixtures'

[[profile.default.overrides]]
filter = 'package(tablepro-session)'
test-group = 'session'

# The app's docker tests are integration targets, and the large-catalog
# and diagram engine cases in its library. Its other unit tests start no
# container, so they keep running in parallel.
[[profile.default.overrides]]
filter = 'package(tablepro) & (kind(test) | test(/::large_catalog::/) | test(/::diagram::engines::/))'
test-group = 'app'

# These press real keys on the X display every test shares. A window
# another test presents takes the focus, and the keys with it, so each
# runs with no other test beside it.
[[profile.default.overrides]]
filter = 'package(tablepro) & test(/::real_keys::/)'
threads-required = 'num-test-threads'

[profile.ci]
fail-fast = false
# A hung test fails with its name after five minutes. Without a bound it
# holds the runner until the job dies with no report.
slow-timeout = { period = "60s", terminate-after = 5 }

# The large-table and large-catalog cases print the times and memory
# their bounds are set from, so the job log keeps them for a passing run
# too.
[[profile.ci.overrides]]
filter = 'test(/a_million_row_table_pages_to_its_end_and_exports$/) | test(/::large_catalog::/)'
success-output = "final"

# MySQL creates a table in milliseconds, so the large-catalog case's
# 50,000 take minutes before it measures anything.
[[profile.ci.overrides]]
filter = 'test(/::large_catalog::/)'
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.ci.junit]
path = "junit.xml"
