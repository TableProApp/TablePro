[workspace]
resolver = "3"
members = [
    "crates/ai",
    "crates/app",
    "crates/core",
    "crates/mcp",
    "crates/net",
    "crates/session",
    "crates/ssh",
    "crates/storage",
    "crates/test-fixtures",
    "crates/test-support",
    "crates/drivers/cassandra",
    "crates/drivers/clickhouse",
    "crates/drivers/duckdb",
    "crates/drivers/mongodb",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/redis",
    "crates/drivers/sqlite",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tablepro-ai = { path = "crates/ai" }
tablepro-core = { path = "crates/core" }
tablepro-driver-cassandra = { path = "crates/drivers/cassandra" }
tablepro-driver-clickhouse = { path = "crates/drivers/clickhouse" }
tablepro-driver-duckdb = { path = "crates/drivers/duckdb" }
tablepro-driver-mongodb = { path = "crates/drivers/mongodb" }
tablepro-driver-mssql = { path = "crates/drivers/mssql" }
tablepro-driver-mysql = { path = "crates/drivers/mysql" }
tablepro-driver-postgres = { path = "crates/drivers/postgres" }
tablepro-driver-redis = { path = "crates/drivers/redis" }
tablepro-driver-sqlite = { path = "crates/drivers/sqlite" }
tablepro-mcp = { path = "crates/mcp" }
tablepro-net = { path = "crates/net" }
tablepro-session = { path = "crates/session" }
tablepro-ssh = { path = "crates/ssh" }
tablepro-storage = { path = "crates/storage" }
tablepro-test-fixtures = { path = "crates/test-fixtures" }
tablepro-test-support = { path = "crates/test-support" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "rt"] }
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The driver dials through its own hyper-rustls connector, so the crate's
# own TLS features would only add a second, unused TLS stack.
clickhouse = { version = "0.15", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "chrono", "uuid", "json"] }
# TLS goes through the ClientConfig the driver builds, on aws-lc-rs.
# Values are read as CqlValue, so no chrono, num-bigint or bigdecimal
# feature is needed.
scylla = { version = "1.9", default-features = false, features = ["rustls-023"] }
# The driver reads and writes DECIMAL through tiberius's own Numeric.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
# The driver hands redis-rs a stream it opened and wrapped in TLS itself, so
# none of the crate's TLS features is on: rustls stays on aws-lc-rs.
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp"] }
# rustls on aws-lc-rs, bson 3 and the resolver a DNS seed list needs. The
# crate's TLS fills its roots from webpki-roots unless a CA file is given,
# so the driver always gives it one: the system store, plus the user's CA.
# The driver names bson's types through this, the same bson 3 the mongodb
# crate uses, with the chrono and uuid conversions the grid's values need.
base64 = "0.22"
bson = { version = "3.1", default-features = false, features = ["chrono-0_4", "serde_json-1", "uuid-1"] }
mongodb = { version = "3.9.1", default-features = false, features = [
    "compat-3-3-0",
    "bson-3",
    "rustls-tls-aws-lc",
    "dns-resolver",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.4"
# No zlib feature: it pulls libz-sys, and the pure-Rust deflate keeps
# the build free of another C dependency. Constant memory lets a sheet
# spill its rows to a temporary file instead of holding them.
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["chrono", "constant_memory"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
fallible-iterator = "0.2"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
postgres-types = { version = "0.2.14", features = ["with-chrono-0_4"] }
postgres-protocol = "0.6.12"
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
clickhouse-types = "0.1.3"
# The provider comes from the ClientConfig the driver builds, so neither
# provider feature is needed, and leaving both off keeps ring out.
tokio-postgres-rustls = { version = "0.14.0", default-features = false }
libsqlite3-sys = ">=0.30.1, <0.38.0"
# DuckDB 1.5, compiled from the sources the crate ships, since only Ubuntu
# 26.10 packages libduckdb (docs/decisions/0025-bundled-duckdb.md). json and
# parquet are linked in, since extensions are never downloaded.
duckdb = { version = "~1.10506", default-features = false, features = ["bundled", "json", "parquet"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
proptest = "1.11"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.7"
pem-rfc7468 = { version = "1", features = ["alloc"] }
socket2 = { version = "0.6", features = ["all"] }
rustix = { version = "1.1", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12"] }
tower-service = "0.3"
http = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
gtk4 = { version = "0.11", features = ["gnome_50"] }
# The PNG and SVG surfaces the ER diagram exports through; the crate is
# already in the tree through gtk4.
cairo-rs = { version = "0.22", features = ["png", "svg"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
gio = { version = "0.22", features = ["v2_88"] }
gio-unix = { version = "0.22", features = ["v2_84"] }
glib = { version = "0.22", features = ["v2_88"] }
glib-build-tools = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
tempfile = "3"
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"
too_many_lines = "deny"
self_named_module_files = "deny"

# Unoptimised with debug info, DuckDB's archive is 2.6 GB, which every
# test binary of the app links, and the engine runs the suites at debug
# speed.
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
