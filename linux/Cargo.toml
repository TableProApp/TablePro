[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/net",
    "crates/session",
    "crates/ssh",
    "crates/storage",
    "crates/test-fixtures",
    "crates/test-support",
    "crates/drivers/clickhouse",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/sqlite",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "rt"] }
russh = "0.63"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clickhouse = { version = "0.15", default-features = false, features = ["rustls-tls-aws-lc", "rustls-tls-webpki-roots"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.4"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
futures = "0.3"
libsqlite3-sys = ">=0.30.1, <0.38.0"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
proptest = "1.11"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.7"
pem-rfc7468 = { version = "1", features = ["alloc"] }
socket2 = { version = "0.6", features = ["all"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12"] }
tower-service = "0.3"
http = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
gtk4 = { version = "0.11", features = ["gnome_50"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
gio = { version = "0.22", features = ["v2_88"] }
glib = { version = "0.22", features = ["v2_88"] }
glib-build-tools = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
tempfile = "3"
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# tiberius 0.12.3 pins libgssapi 0.4, whose `Buf::deref` is undefined behaviour
# on the empty token of a successful Kerberos login (prisma/tiberius#343), and
# rustls 0.21 with rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). Upstream
# main at tiberius-rs/tiberius fixes both and has no release yet. Drop this pin
# and bump `tiberius` when 0.13 is published.
[patch.crates-io]
tiberius = { git = "https://github.com/tiberius-rs/tiberius", rev = "c1d2e741ee6fe0935091826d91fb5886b6a4082a" }
