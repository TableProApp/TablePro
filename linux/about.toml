# cargo-about settings for data/licenses, which
# build-aux/update-third-party-licenses.sh writes.
#
# `accepted` is deny.toml's [licenses].allow in the same order, so a crate
# under "MIT OR Apache-2.0" is listed under the first one deny accepts.
# third-party.json also keeps the whole expression of each crate, which
# the Debian copyright file and the RPM License tag name.
accepted = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
    "0BSD",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Neither kind of crate ends up in the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are TablePro, under LICENSE.
private = { ignore = true }

# Without a license file cargo-about can read, a crate gets the SPDX
# template text, which names no copyright holder. Each entry below names
# the crate's own file: in the crate, or, for a crate that packages none
# or only a symlink, in its repository at the published commit. An entry
# whose checksum no longer matches is dropped, and
# update-third-party-licenses.sh then names the crate.

# The LICENSE lists the copyright of every bundled component.
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

