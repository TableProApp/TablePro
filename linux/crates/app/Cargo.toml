[package]
name = "tablepro"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tablepro_app"

[[test]]
name = "startup"
harness = false

[[test]]
name = "i18n_catalog"
harness = false

[[test]]
name = "logging"
harness = false

# A panic hook is process-wide and the crash ends the process, so each
# case runs in a child of the binary.
[[test]]
name = "crash_report"
harness = false

# These start the application, which GTK allows only on the process's
# main thread, so they run without the test harness.
[[test]]
name = "application_uniqueness"
harness = false

[[test]]
name = "application_lifecycle"
harness = false

# D-Bus starts the binary, which opens its windows on GTK's main thread.
[[test]]
name = "open_files"
harness = false

[[test]]
name = "application_session_restore"
harness = false

[[test]]
name = "kill_during_save"
harness = false

[[test]]
name = "accessibility"
harness = false

[features]
default = ["kerberos"]
kerberos = ["tablepro-driver-mssql/kerberos"]

[dependencies]
tablepro-ai.workspace = true
tablepro-core.workspace = true
tablepro-driver-cassandra.workspace = true
tablepro-driver-clickhouse.workspace = true
tablepro-driver-duckdb.workspace = true
tablepro-driver-mongodb.workspace = true
tablepro-driver-mssql.workspace = true
tablepro-driver-mysql.workspace = true
tablepro-driver-postgres.workspace = true
tablepro-driver-redis.workspace = true
tablepro-driver-sqlite.workspace = true
tablepro-mcp.workspace = true
tablepro-net.workspace = true
tablepro-session.workspace = true
tablepro-ssh.workspace = true
tablepro-storage.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
gio.workspace = true
gio-unix.workspace = true
gtk4.workspace = true
cairo-rs.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
glib.workspace = true
relm4.workspace = true
# CLOCK_BOOTTIME, which std does not expose, tells a suspend apart.
rustix = { workspace = true, features = ["time"] }
secrecy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
# Counts grouped the way the user's locale groups digits.
icu_decimal = { version = "2.3", features = ["alloc"] }
icu_locale_core = { version = "2.3", features = ["alloc"] }
# The assistant's replies are Markdown; the HTML writer stays off.
pulldown-cmark = { version = "0.13", default-features = false }
sqlformat = "0.5"

[dev-dependencies]
proptest.workspace = true
tablepro-session = { workspace = true, features = ["fakes"] }
tablepro-test-fixtures.workspace = true
tablepro-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util", "io-util"] }
# tokio-postgres logs through `log`, so the logging tests drive that
# bridge the way it does.
log = "0.4"
tracing-log = "0.2"
# Real key presses through XTEST, which GDK reads as it reads a keyboard.
x11rb = { version = "0.14", features = ["xtest"] }

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
