[package]
name = "tablepro"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "tablepro_app"
path = "src/lib.rs"

[[bin]]
name = "tablepro"
path = "src/main.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"
harness = false

[[test]]
name = "i18n_catalog"
path = "tests/i18n_catalog.rs"
harness = false

[[test]]
name = "logging"
path = "tests/logging.rs"
harness = false

[features]
default = ["kerberos"]
kerberos = ["tablepro-driver-mssql/kerberos"]

[dependencies]
tablepro-core = { path = "../core" }
tablepro-driver-clickhouse = { path = "../drivers/clickhouse" }
tablepro-driver-mssql = { path = "../drivers/mssql" }
tablepro-driver-mysql = { path = "../drivers/mysql" }
tablepro-driver-postgres = { path = "../drivers/postgres" }
tablepro-driver-sqlite = { path = "../drivers/sqlite" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tablepro-ssh = { path = "../ssh" }
tablepro-session = { path = "../session" }
tablepro-storage = { path = "../storage" }
gio.workspace = true
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
glib.workspace = true
relm4.workspace = true
secrecy.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"
sqlformat = "0.5"

[dev-dependencies]
tablepro-test-support = { path = "../test-support" }
tracing.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
tempfile.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
