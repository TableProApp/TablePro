[package]
name = "tablepro-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tablepro-app"
path = "src/main.rs"

[dependencies]
tablepro-core = { path = "../core" }
tablepro-driver-mssql = { path = "../drivers/mssql" }
tablepro-driver-mysql = { path = "../drivers/mysql" }
tablepro-driver-postgres = { path = "../drivers/postgres" }
tablepro-driver-sqlite = { path = "../drivers/sqlite" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tablepro-ssh = { path = "../ssh" }
tablepro-storage = { path = "../storage" }
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
glib.workspace = true
relm4.workspace = true
secrecy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-channel.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gettext-rs = { version = "0.7", features = ["gettext-system"] }
libc = "0.2"
sqlformat = "0.5"
