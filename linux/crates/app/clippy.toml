allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

disallowed-methods = [
    # Catalogue text goes into DDL verbatim, so only a driver may build
    # one from a string. User input goes through SqlDialect::parse_type
    # or parse_expression first.
    { path = "tablepro_core::column::SqlTypeExpr::from_catalog_text", reason = "catalog text only; validate user input with SqlDialect::parse_type/parse_expression" },
    { path = "tablepro_core::column::SqlExpression::from_catalog_text", reason = "catalog text only; validate user input with SqlDialect::parse_type/parse_expression" },

    # Background work goes through Tasks, which holds the one handle
    # AppRuntime created. Reaching for the ambient runtime hides where
    # work runs and panics on the GTK thread, which has no runtime.
    { path = "tokio::runtime::Handle::current", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::try_current", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::block_on", reason = "blocking a runtime thread deadlocks it; use spawn_blocking_task" },
    { path = "tokio::runtime::Runtime::enter", reason = "take the handle from Tasks" },
    { path = "tokio::runtime::Handle::enter", reason = "take the handle from Tasks" },

    # Background work goes through Tasks so there is one place that
    # decides where it runs. These reach for whichever runtime happens
    # to be ambient, which on the GTK thread is none at all.
    { path = "tokio::spawn", reason = "use Tasks::spawn_task" },
    { path = "tokio::task::spawn_blocking", reason = "use Tasks::spawn_blocking_task" },
    { path = "tokio::runtime::Handle::spawn", reason = "use Tasks::spawn_task" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use Tasks::spawn_blocking_task" },
    { path = "relm4::spawn", reason = "use Tasks::spawn_task" },
    { path = "relm4::spawn_blocking", reason = "use Tasks::spawn_blocking_task" },
    { path = "relm4::spawn_local", reason = "use glib::spawn_future_local" },

    # Blocking the GTK main loop freezes every window, and quitting from
    # under it skips the shutdown that flushes pending writes.
    { path = "gtk4::glib::MainContext::block_on", reason = "await in glib::spawn_future_local instead of blocking the main loop" },
    { path = "gio::prelude::ApplicationExt::quit", reason = "use TableProApplication::request_quit, which closes each window through its prompts" },

    # A window can close while work it started is still on its way back.
    # These panic on a component that has shut down; deliver drops the
    # message instead.
    { path = "relm4::ComponentSender::input", reason = "use crate::runtime::DeliverInput::deliver" },
    { path = "relm4::FactorySender::input", reason = "use crate::runtime::DeliverInput::deliver" },

    # TableProApplication owns the windows and the app actions. Relm4's
    # own application builds a second one that knows neither.
    { path = "relm4::RelmApp::run", reason = "open windows with TableProApplication::open_window" },
    { path = "relm4::main_application", reason = "take the application from the window or its WindowHost" },
    { path = "relm4::main_adw_application", reason = "take the application from the window or its WindowHost" },
    { path = "relm4::actions::RelmActionGroup::register_for_main_application", reason = "add actions with add_action_entries on the window or the application" },
    { path = "relm4::ComponentBuilder::transient_for", reason = "relm4 applies it only from RelmApp; present dialogs on their parent window" },
    { path = "relm4::ComponentBuilder::transient_for_native", reason = "relm4 applies it only from RelmApp; present dialogs on their parent window" },
]
