[package]
name = "tablepro-driver-mssql"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "drivers_mssql"
path = "src/lib.rs"

[features]
default = []
kerberos = ["tiberius/integrated-auth-gssapi"]

[dependencies]
tablepro-core = { path = "../../core" }
tablepro-net = { path = "../../net" }
async-trait.workspace = true
chrono.workspace = true
deadpool.workspace = true
futures-util.workspace = true
secrecy.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tablepro-test-fixtures = { path = "../../test-fixtures" }
tablepro-test-support = { path = "../../test-support" }
async-trait.workspace = true
chrono.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid.workspace = true

[lints]
workspace = true
