[package]
name = "tablepro-driver-mysql"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "drivers_mysql"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
tablepro-net = { path = "../../net" }
async-trait.workspace = true
chrono.workspace = true
deadpool.workspace = true
futures-util.workspace = true
secrecy.workspace = true
sqlx = { workspace = true, features = ["mysql", "mysql-rsa", "tls-rustls-aws-lc-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
tablepro-test-fixtures = { path = "../../test-fixtures" }
tablepro-test-support = { path = "../../test-support" }
async-trait.workspace = true
chrono.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
