[package]
name = "tablepro-driver-sqlite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "drivers_sqlite"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
futures.workspace = true
# One direct call, sqlite3_get_autocommit, until sqlx exposes the
# transaction state of a connection. The range follows sqlx-sqlite's own,
# because only one libsqlite3-sys can be linked.
libsqlite3-sys.workspace = true
sqlparser.workspace = true
sqlx = { workspace = true, features = ["sqlite-unbundled"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tablepro-test-support = { path = "../../test-support" }
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
