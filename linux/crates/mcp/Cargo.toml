[package]
name = "tablepro-mcp"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tablepro-core.workspace = true
tablepro-session.workspace = true
tablepro-storage.workspace = true
async-trait.workspace = true
bytes.workspace = true
getrandom = "0.3"
http.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { workspace = true }
# The protocol, its versions and the Streamable HTTP transport, which
# checks the Host header for a loopback name and refuses any Origin.
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tablepro-driver-sqlite.workspace = true
tablepro-ssh.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
