[package]
name = "tablepro-session"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# FakeConnector and FakeCredentialSource for the tests of crates that
# start sessions. Never on in a release build.
fakes = ["dep:tablepro-test-support"]

[dependencies]
tablepro-core.workspace = true
tablepro-net.workspace = true
tablepro-ssh.workspace = true
tablepro-storage.workspace = true
tablepro-test-support = { workspace = true, optional = true }
futures.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tablepro-driver-postgres.workspace = true
tablepro-driver-redis.workspace = true
tablepro-test-fixtures.workspace = true
tablepro-test-support.workspace = true
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
