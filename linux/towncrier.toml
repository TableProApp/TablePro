[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/TableProApp/TablePro/releases/tag/linux-v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/TableProApp/TablePro/pull/{issue})"
underlines = ["", "", ""]
ignore = []
issue_pattern = "\\d+"

[[tool.towncrier.type]]
name = "Added"

[[tool.towncrier.type]]
name = "Changed"

[[tool.towncrier.type]]
name = "Deprecated"

[[tool.towncrier.type]]
name = "Removed"

[[tool.towncrier.type]]
name = "Fixed"

[[tool.towncrier.type]]
name = "Security"
