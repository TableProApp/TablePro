name: TablePro

# TablePro.xcodeproj is generated from this file and is not in git.
# Run scripts/generate-project.sh after changing anything here, and after
# adding, moving, or deleting a source file.

options:
  minimumXcodeGenVersion: "2.46.0"
  projectFormat: xcode16_3
  defaultConfig: Release
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  transitivelyLinkDependencies: false
  localPackagesGroup: Packages
  deploymentTarget:
    macOS: "13.0"

configs:
  Debug: debug
  Release: release

# Project-wide and per-configuration build settings live in these files.
# Per-target settings live below, next to the target that needs them.
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES

fileGroups:
  - Configs
  - TestPlans
  - project.yml

packages:
  TableProEditor:
    path: Packages/TableProEditor
  TableProGrammars:
    path: Packages/TableProGrammars
  TableProCore:
    path: Packages/TableProCore
  TableProMacCore:
    path: Packages/TableProMacCore
  TableProOracle:
    path: Packages/TableProOracle
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.10.0
  Yams:
    url: https://github.com/jpsim/Yams
    majorVersion: 5.1.0
  # Kafka brokers hand a consumer whatever codec the producer stored, and never transcode.
  # macOS supplies no zstd at any layer, so a zstd topic is unreadable without this.
  zstd:
    url: https://github.com/facebook/zstd
    majorVersion: 1.5.0
  # Already in the graph through Packages/TableProOracle. Declared here so the Kafka plugin
  # can link them directly: Kafka is a length-prefixed binary protocol over TCP, and NIOSSL
  # reads the PEM paths SSLConfiguration already carries.
  swift-nio:
    url: https://github.com/apple/swift-nio
    minVersion: 2.81.0
    maxVersion: 3.0.0
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl
    minVersion: 2.29.0
    maxVersion: 3.0.0

# Every .tableplugin bundle is this template plus a folder name and a principal class.
# A bundled plugin that links a C library or a package product takes it from a linkage template,
# which its test bundle shares, so the two never link differently. Registry plugins add theirs
# themselves.
targetTemplates:
  DriverPlugin:
    type: bundle
    platform: macOS
    sources:
      - path: Plugins/${folder}
        excludes:
          - Info.plist
          - README.md
      - Plugins/Shared/PluginConnectTimeout.swift
      - Plugins/Shared/PluginQueryTimeout.swift
      - Plugins/Shared/PluginURLSessionTaskBox.swift
    dependencies:
      - target: TableProPluginKit
        embed: false
        link: true
    scheme: {}
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: $(TABLEPRO_DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Plugins/${folder}/Info.plist
        INFOPLIST_KEY_NSPrincipalClass: $(PRODUCT_MODULE_NAME).${principalClass}
        # Keeps TableProPluginKitVersion an <integer>: .claude/rules/plugin-system.md, ABI.
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: TABLEPRO_PLUGINKIT_VERSION=$(TABLEPRO_PLUGINKIT_VERSION)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.${target_name}
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        # A plugin's strings resolve against the host app's bundle and are translated in the app's
        # catalog, so an export that also listed them per plugin would offer each one twice.
        LOCALIZATION_EXPORT_SUPPORTED: NO
        # The app, both helper tools and the test bundles compile under these. A plugin bundle is
        # loaded into that same process, so without them one nonisolated async function has two
        # execution semantics depending on which target compiled it.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        WRAPPER_EXTENSION: tableplugin
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES

  # A bundled plugin's folder compiled again with its tests and no host app. It links the same
  # TableProPluginKit framework the plugin does: a package product that depended on the package's
  # TableProPluginKit would give the plugin code its own copy of PluginKit's types.
  PluginTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Plugins/${folder}
        excludes:
          - Info.plist
          - README.md
      - Plugins/Shared
      - Plugins/${target_name}
    dependencies:
      - target: TableProPluginKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Set, or XcodeGen picks the plugin folder's Info.plist, which only the plugin preprocesses.
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.${target_name}
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

  MySQLLinkage:
    dependencies:
      - package: TableProCore
        products: [TableProGeometry, TableProLogRedaction, TableProMySQLCore]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Plugins/MySQLDriverPlugin/CMariaDB/include
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - $(SRCROOT)/Libs/dylibs
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Libs
          - $(SRCROOT)/Libs/dylibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libmariadb.a
          - -lssl.3
          - -lcrypto.3
          - -liconv
          - -lz
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Plugins/MySQLDriverPlugin/CMariaDB

  PostgreSQLLinkage:
    dependencies:
      - package: TableProCore
        products: [TableProLogRedaction, TableProPostgreSQLCore]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Plugins/PostgreSQLDriverPlugin/CLibPQ/include
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - $(SRCROOT)/Libs/dylibs
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Libs
          - $(SRCROOT)/Libs/dylibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libpq.a
          - $(SRCROOT)/Libs/libpgcommon.a
          - $(SRCROOT)/Libs/libpgport.a
          - -lssl.3
          - -lcrypto.3
          - -lz
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Plugins/PostgreSQLDriverPlugin/CLibPQ

  RedisLinkage:
    dependencies:
      - package: TableProCore
        product: TableProRedisCore
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Plugins/RedisDriverPlugin/CRedis/include
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - $(SRCROOT)/Libs/dylibs
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Libs
          - $(SRCROOT)/Libs/dylibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libhiredis.a
          - -force_load
          - $(SRCROOT)/Libs/libhiredis_ssl.a
          - -lssl.3
          - -lcrypto.3
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Plugins/RedisDriverPlugin/CRedis

  # Links its own SQLite (scripts/build-sqlite.sh), never -lsqlite3: macOS's library is built without
  # extension loading.
  SQLiteLinkage:
    dependencies:
      - package: TableProCore
        products: [CSQLite, TableProSQLiteCore]
    settings:
      base:
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libsqlite3_vendored.a

  ClickHouseLinkage:
    dependencies:
      - package: TableProCore
        products: [TableProNumberFormatting, TableProTLSClientIdentity]

  # The SAP HANA driver runs go-hdb in tablepro-hana-helper, which scripts/build-hana.sh builds
  # and this phase copies into Contents/MacOS, where the plugin looks it up. A missing helper
  # stops the build with "Build input file cannot be found" naming its path. The copy is signed
  # in a directory from mktemp: the user-script sandbox lets the phase write its declared output
  # and nothing beside it, codesign writes a temporary file next to whatever it signs, and it
  # reads every parent of that file, which the sandbox refuses inside the build folders.
  # scripts/release/build.sh passes OTHER_CODE_SIGN_FLAGS=--timestamp; other builds skip the timestamp server.
  HanaHelperEmbedding:
    postBuildScripts:
      - name: Embed tablepro-hana-helper
        inputFiles:
          - $(SRCROOT)/Native/HanaBridge/bin/tablepro-hana-helper
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/tablepro-hana-helper
        script: |
          set -eu
          helper="$SCRIPT_INPUT_FILE_0"
          for arch in $ARCHS; do
              if ! /usr/bin/lipo "$helper" -verify_arch "$arch"; then
                  echo "error: $helper has no $arch slice. Run scripts/build-hana.sh $arch, or both." >&2
                  exit 1
              fi
          done
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp "$helper" "$staging/tablepro-hana-helper"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ]; then
              /usr/bin/codesign --force --options runtime ${OTHER_CODE_SIGN_FLAGS:---timestamp=none} --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$staging/tablepro-hana-helper"
          fi
          cp -f "$staging/tablepro-hana-helper" "$SCRIPT_OUTPUT_FILE_0"

targets:

  # ─── Application ──────────────────────────────────────────────────────────────

  TablePro:
    type: application
    platform: macOS
    sources:
      - path: TablePro
        excludes:
          # main() for the tablepro-mcp helper.
          - CLI/BridgeMain.swift
          # main() for the tablepro-imagerender helper, which is a whole executable on
          # its own: nothing in it is reachable from the app.
          - CLI/ImageRenderMain.swift
          # Copied whole below. A plain glob flattens it into Resources/ and the
          # inventory then cannot find its texts/ directory.
          - Resources/ThirdPartyLicenses
          # The tablepro shim, copied below to Contents/SharedSupport/bin. Contents/MacOS
          # cannot hold it: the volume is case-insensitive and TablePro already lives there.
          - CLI/tablepro
      - path: TablePro/Resources/ThirdPartyLicenses
        type: folder
        buildPhase: resources
      - path: TablePro/CLI/tablepro
        buildPhase:
          copyFiles:
            destination: sharedSupport
            subpath: bin
      # The etcd plugin's own command parser, so the app tiers an etcd statement by the operation
      # the driver parses it into.
      - Plugins/EtcdDriverPlugin/EtcdCommandParser.swift
      # The MySQL plugin's socket key and path rules, so the app writes and checks the socket path
      # exactly as the driver reads it.
      - Plugins/MySQLDriverPlugin/MySQLLocalSocket.swift
    configFiles:
      Debug: Configs/Version.xcconfig
      Release: Configs/Version.xcconfig
    dependencies:
      - target: TableProPluginKit
        embed: true
        codeSign: true
        removeHeaders: true
      # Embedded rather than reached through an absolute rpath into the source tree.
      # TablePro.debug.dylib and the MySQL, PostgreSQL and Redis plugins all link
      # @rpath/libssl.3.dylib and @rpath/libcrypto.3.dylib, and both dylibs already carry an
      # @rpath install name, so @executable_path/../Frameworks resolves them once they are here.
      # Without this the app only launched from a checkout that had Libs/dylibs on disk, which is
      # what made the sharded test jobs abort with SIGABRT before XCTest could connect (#2334).
      # A release build was already self-contained: build-release.sh copies them in.
      #
      # codeSign matters as much as embed. create-openssl-dylibs.sh leaves them ad-hoc signed, and
      # codesign refuses a bundle whose nested code carries a different identity from the app:
      # "code object is not signed at all, in subcomponent libcrypto.3.dylib". A plain copy-files
      # phase does not re-sign, so this built only until download-libs.sh next regenerated the
      # dylibs. CI never saw it, because every CI build passes CODE_SIGNING_ALLOWED=NO.
      #
      # link: false keeps this to embedding and signing. A framework dependency links by default,
      # which would put both into Link Binary With Libraries and change what the app links against;
      # the app reaches them through @rpath from TablePro.debug.dylib and the plugins, as before.
      - framework: Libs/dylibs/libssl.3.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Libs/dylibs/libcrypto.3.dylib
        embed: true
        codeSign: true
        link: false
      - target: mcp-server
        embed: true
        codeSign: true
        removeHeaders: false
        copy:
          destination: executables
      - target: image-renderer
        embed: true
        codeSign: true
        removeHeaders: false
        copy:
          destination: executables
      # Plugins shipped inside the app bundle: the BundledPlugins aggregate lists the same set.
      - target: MySQLDriver
        embed: true
        copy: { destination: plugins }
      - target: PostgreSQLDriver
        embed: true
        copy: { destination: plugins }
      - target: SQLiteDriver
        embed: true
        copy: { destination: plugins }
      - target: ClickHouseDriver
        embed: true
        copy: { destination: plugins }
      - target: RedisDriver
        embed: true
        copy: { destination: plugins }
      - target: CSVExport
        embed: true
        copy: { destination: plugins }
      - target: JSONExport
        embed: true
        copy: { destination: plugins }
      - target: SQLExport
        embed: true
        copy: { destination: plugins }
      - target: MarkdownExport
        embed: true
        copy: { destination: plugins }
      - target: XLSXImport
        embed: true
        copy: { destination: plugins }
      - target: XLSXExport
        embed: true
        copy: { destination: plugins }
      - target: MQLExport
        embed: true
        copy: { destination: plugins }
      - target: SQLImport
        embed: true
        copy: { destination: plugins }
      - target: JSONImport
        embed: true
        copy: { destination: plugins }
      - target: CSVImport
        embed: true
        copy: { destination: plugins }
      - package: TableProEditor
        products: [TableProEditorKit, TableProTextEngine]
      - package: TableProGrammars
      - package: Sparkle
      - package: Yams
      - package: TableProCore
        products: [TableProAnalytics, TableProConnectionLibrary, TableProGeometry, TableProGoogleCloud, TableProImport, TableProLogRedaction, TableProNumberFormatting, TableProRedisCore, TableProSQLGrammar, TableProSSHTransport, TableProSyncTransport, TableProTabular, TableProTabularIO, TableProTheme]
      - package: TableProMacCore
        products: [TableProAutocomplete, TableProMCP, TableProSSHConfig, TableProUtilities]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: $(TABLEPRO_DEVELOPMENT_TEAM)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/TablePro/Core/SSH/CLibSSH2/include
        INFOPLIST_FILE: TablePro/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TablePro
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          # No $(SRCROOT)/Libs/dylibs here. The two dylibs are copied into Contents/Frameworks
          # above, so @executable_path/../Frameworks resolves them and the built app no
          # longer depends on the checkout it was built from.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Libs/dylibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libssh2.a
          - -lssl.3
          - -lcrypto.3
          - -lz
        PRODUCT_BUNDLE_IDENTIFIER: $(TABLEPRO_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(TARGET_NAME)
        PROVISIONING_PROFILE_SPECIFIER: $(TABLEPRO_PROVISIONING_PROFILE)
        REGISTER_APP_GROUPS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TablePro/Core/SSH/CLibSSH2
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      configs:
        Debug:
          # Drops iCloud so a free Apple team can sign a local build.
          CODE_SIGN_ENTITLEMENTS: TablePro/TablePro.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TablePro/TablePro.entitlements
          COPY_PHASE_STRIP: YES
          DEPLOYMENT_POSTPROCESSING: YES

  # ─── Plugin ABI ───────────────────────────────────────────────────────────────

  TableProPluginKit:
    type: framework
    platform: macOS
    sources:
      - path: Plugins/TableProPluginKit
    scheme: {}
    settings:
      base:
        # Swift Library Evolution. Removing this breaks every already-built plugin.
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        CURRENT_PROJECT_VERSION: 1
        DEFINES_MODULE: YES
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: YES
        INSTALL_PATH: $(LOCAL_LIBRARY_DIR)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProPluginKit
        PRODUCT_NAME: $(TARGET_NAME:c99extidentifier)
        SKIP_INSTALL: YES
        LOCALIZATION_EXPORT_SUPPORTED: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        # The app and every plugin bundle link this framework, and every one of those links
        # waits for its link step without this. It is Swift-only, so the build system can emit a
        # TBD and unblock them.
        EAGER_LINKING: YES
        # No Objective-C anywhere in the framework and nothing imports the generated header, which
        # the app then strips again with removeHeaders at embed time.
        SWIFT_INSTALL_OBJC_HEADER: NO

  # ─── MCP stdio bridge, embedded in the app as Contents/MacOS/tablepro-mcp ─────

  mcp-server:
    type: tool
    platform: macOS
    sources:
      - TablePro/CLI/BridgeMain.swift
    dependencies:
      - package: TableProMacCore
        products: [TableProMCP, TableProUtilities]
    scheme: {}
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.tablepro-mcp
        # The app embeds it; installed on its own it turns the app archive into a generic one.
        SKIP_INSTALL: YES
        PRODUCT_NAME: tablepro-mcp
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

  # ─── Out-of-process image rasterizer, embedded as Contents/MacOS/tablepro-imagerender ─

  image-renderer:
    type: tool
    platform: macOS
    # Deliberately a leaf: the whole point is that an SVG this parses cannot take the app
    # down with it, so it shares no code and reads nothing but stdin.
    sources:
      - TablePro/CLI/ImageRenderMain.swift
      # The one rule the app and the renderer must not disagree about. Dependency-free, so the
      # renderer stays a leaf.
      - TablePro/Core/Services/Formatting/SvgDocumentGate.swift
    scheme: {}
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.tablepro-imagerender
        # The app embeds it; installed on its own it turns the app archive into a generic one.
        SKIP_INSTALL: YES
        PRODUCT_NAME: tablepro-imagerender
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

  # ─── Tests ────────────────────────────────────────────────────────────────────

  TableProTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TableProTests
    dependencies:
      - target: TablePro
      # The app's packages reach the tests through TEST_HOST, so only what the app does not link is listed.
      - package: TableProCore
        products: [TableProPostgreSQLCore, TableProTestSupport]
      - package: TableProMacCore
        products: [TableProMCPTestSupport]
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/TablePro/Core/SSH/CLibSSH2/include
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProTests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TablePro/Core/SSH/CLibSSH2
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

  TableProUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TableProUITests
    dependencies:
      - target: TablePro
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.TableProUITests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

  # ─── Plugins bundled in the app ───────────────────────────────────────────────

  MySQLDriver:
    templates: [DriverPlugin, MySQLLinkage]
    templateAttributes:
      folder: MySQLDriverPlugin
      principalClass: MySQLPlugin

  PostgreSQLDriver:
    templates: [DriverPlugin, PostgreSQLLinkage]
    templateAttributes:
      folder: PostgreSQLDriverPlugin
      principalClass: PostgreSQLPlugin

  SQLiteDriver:
    templates: [DriverPlugin, SQLiteLinkage]
    templateAttributes:
      folder: SQLiteDriverPlugin
      principalClass: SQLitePlugin
    settings:
      base:
        # Above plugin-sqlite-v1.0.1, the newest copy published to the registry. `selectWinners`
        # compares versions numerically, so the fixed built-in must replace a retained user copy.
        MARKETING_VERSION: "1.0.2"

  ClickHouseDriver:
    templates: [DriverPlugin, ClickHouseLinkage]
    templateAttributes:
      folder: ClickHouseDriverPlugin
      principalClass: ClickHousePlugin
    settings:
      base:
        # Above plugin-clickhouse-v1.0.19, the newest copy published to the registry. `selectWinners`
        # compares versions numerically, so the fixed built-in must replace a retained user copy.
        MARKETING_VERSION: "1.0.20"

  RedisDriver:
    templates: [DriverPlugin, RedisLinkage]
    templateAttributes:
      folder: RedisDriverPlugin
      principalClass: RedisPlugin
    settings:
      base:
        # Above plugin-redis-v1.0.19, the newest copy published to the registry. `selectWinners`
        # compares versions numerically, so the fixed built-in must replace a retained user copy.
        MARKETING_VERSION: "1.0.20"

  CSVExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: CSVExportPlugin
      principalClass: CSVExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.CSVExportPlugin

  JSONExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: JSONExportPlugin
      principalClass: JSONExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.JSONExportPlugin

  MarkdownExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: MarkdownExportPlugin
      principalClass: MarkdownExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.MarkdownExportPlugin

  XLSXImport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: XLSXImportPlugin
      principalClass: XLSXImportPlugin
    dependencies:
      - package: TableProCore
        product: TableProTabularIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.XLSXImportPlugin

  ParquetExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: ParquetExportPlugin
      principalClass: ParquetExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.ParquetExportPlugin
        # DuckDB does the Parquet encoding, so this links the same static library the
        # DuckDB driver does. That is why the plugin is registry-only rather than bundled:
        # 149MB universal is not worth adding to every app download for one export format.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Plugins/DuckDBDriverPlugin/CDuckDB/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Libs
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/Libs/libduckdb.a
          - -lc++
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Plugins/DuckDBDriverPlugin/CDuckDB

  SQLExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: SQLExportPlugin
      principalClass: SQLExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.SQLExportPlugin

  XLSXExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: XLSXExportPlugin
      principalClass: XLSXExportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.XLSXExportPlugin

  MQLExport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: MQLExportPlugin
      principalClass: MQLExportPlugin
    dependencies:
      - package: TableProCore
        product: TableProJavaScriptText
      - package: TableProCore
        product: TableProNumberFormatting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.MQLExportPlugin
        # Above plugin-mql-v1.0.7, the newest copy published to the registry. `selectWinners`
        # compares versions numerically, so at the template's 1.0 a retained user copy would keep
        # writing server-provided names into exports unescaped.
        MARKETING_VERSION: "1.0.8"

  SQLImport:
    templates: [DriverPlugin]
    templateAttributes:
      folder: SQLImportPlugin
      principalClass: SQLImportPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.SQLImportPlugin
        # Above plugin-sqlimport-v1.0.5, the newest copy published to the registry. `selectWinners`
        # compares versions numerically, so at the template's 1.0 a retained user copy would keep
        # offering SQL on MongoDB.
        MARKETING_VERSION: "1.0.6"

  JSONImport:
