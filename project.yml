        product: TableProOracleCore

  SnowflakeDriverPlugin:
    templates: [DriverPlugin]
    templateAttributes:
      folder: SnowflakeDriverPlugin
      principalClass: SnowflakePlugin

  SurrealDBDriverPlugin:
    templates: [DriverPlugin]
    templateAttributes:
      folder: SurrealDBDriverPlugin
      principalClass: SurrealDBPlugin

  TeradataDriver:
    templates: [DriverPlugin]
    templateAttributes:
      folder: TeradataDriverPlugin
      principalClass: TeradataPlugin
    dependencies:
