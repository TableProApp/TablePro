        product: TableProTeradataCore

  TrinoDriverPlugin:
    templates: [DriverPlugin]
    templateAttributes:
      folder: TrinoDriverPlugin
      principalClass: TrinoPlugin
    dependencies:
      - package: TableProCore
        product: TableProTrinoCore

# Compile-checks every plugin, including the registry-only ones the app does not
# embed. CI builds this scheme so a registry plugin cannot rot between releases.
aggregateTargets:
  AllPlugins:
    targets:
      - BeancountDriver
      - BigQueryDriverPlugin
      - CSVExport
      - CSVImport
      - CSVInspectorPlugin
      - CassandraDriver
      - ClickHouseDriver
      - CloudflareD1DriverPlugin
      - DamengDriver
      - DuckDBDriver
      - DynamoDBDriverPlugin
      - ElasticsearchDriverPlugin
      - EtcdDriverPlugin
      - JSONExport
      - JSONImport
      - LibSQLDriverPlugin
      - MQLExport
      - MSSQLDriver
      - MongoDBDriver
      - MySQLDriver
      - OracleDriver
      - PostgreSQLDriver
      - RedisDriver
      - SQLExport
      - SQLImport
      - SQLiteDriver
      - SnowflakeDriverPlugin
      - SurrealDBDriverPlugin
      - TeradataDriver
      - TrinoDriverPlugin
      - XLSXExport
    scheme: {}

schemes:
  DamengDriverTests:
    build:
      targets:
        DamengDriverTests: test
      buildImplicitDependencies: true
    test:
      config: Debug
      targets:
        - name: DamengDriverTests

  TablePro:
    build:
      targets:
        TablePro: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TableProTests
          parallelizable: true
        - name: TableProUITests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
