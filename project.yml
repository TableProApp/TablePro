# Every plugin is in exactly one of BundledPlugins (embedded in the app) and RegistryPlugins (each
# release publishes it); scripts/ci/check-plugin-manifest.py enforces it. AllPlugins compiles both.
aggregateTargets:
  BundledPlugins:
    targets:
      - CSVExport
      - CSVImport
      - ClickHouseDriver
      - JSONExport
      - JSONImport
      - MQLExport
      - MarkdownExport
      - MySQLDriver
      - PostgreSQLDriver
      - RedisDriver
      - SQLExport
      - SQLImport
      - SQLiteDriver
      - XLSXExport
      - XLSXImport

  RegistryPlugins:
    targets:
      - BeancountDriver
      - BigQueryDriverPlugin
      - BigtableDriverPlugin
      - CassandraDriver
      - CloudflareD1DriverPlugin
      - CloudflareR2SQLDriverPlugin
      - DamengDriver
      - DuckDBDriver
      - DynamoDBDriverPlugin
      - ElasticsearchDriverPlugin
      - EtcdDriverPlugin
      - FirebaseDriverPlugin
      - HanaDriver
      - KafkaDriverPlugin
      - LibSQLDriverPlugin
      - MSSQLDriver
      - MongoDBDriver
      - OracleDriver
      - ParquetExport
      - SnowflakeDriverPlugin
      - SpannerDriverPlugin
      - SurrealDBDriverPlugin
      - TeradataDriver
      - TrinoDriverPlugin
      - TypesenseDriverPlugin
      - WeaviateDriverPlugin
    scheme: {}

  AllPlugins:
    targets:
      - BundledPlugins
      - RegistryPlugins
    scheme: {}

schemes:
  TablePro:
    build:
      targets:
        TablePro: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: TestPlans/Unit.xctestplan
          defaultPlan: true
        - path: TestPlans/UI.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
