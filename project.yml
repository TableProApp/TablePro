  # ─── Tests of the bundled plugins, hostless ───────────────────────────────────

  MySQLDriverTests:
    templates: [PluginTests, MySQLLinkage]
    templateAttributes:
      folder: MySQLDriverPlugin

  PostgreSQLDriverTests:
    templates: [PluginTests, PostgreSQLLinkage]
    templateAttributes:
      folder: PostgreSQLDriverPlugin

  RedisDriverTests:
    templates: [PluginTests, RedisLinkage]
    templateAttributes:
      folder: RedisDriverPlugin

  SQLiteDriverTests:
    templates: [PluginTests, SQLiteLinkage]
    templateAttributes:
      folder: SQLiteDriverPlugin

  ClickHouseDriverTests:
    templates: [PluginTests, ClickHouseLinkage]
    templateAttributes:
      folder: ClickHouseDriverPlugin

  # The ten bundled format plugins in one bundle: none links a C library, and no two declare the
  # same top-level name.
  FormatPluginTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Plugins/CSVExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/CSVImportPlugin
        excludes:
          - Info.plist
      - path: Plugins/JSONExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/JSONImportPlugin
        excludes:
          - Info.plist
      - path: Plugins/MarkdownExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/MQLExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/SQLExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/SQLImportPlugin
        excludes:
          - Info.plist
      - path: Plugins/XLSXExportPlugin
        excludes:
          - Info.plist
      - path: Plugins/XLSXImportPlugin
        excludes:
          - Info.plist
      - Plugins/Shared
      - Plugins/FormatPluginTests
    dependencies:
      - target: TableProPluginKit
      - package: TableProCore
        products: [TableProJavaScriptText, TableProNumberFormatting, TableProTabularIO]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Set for the reason the PluginTests template gives.
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.TablePro.FormatPluginTests
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

