# Analysis settings kept with the code so the triage is reviewed like any change.
# Each rule below is a deliberate won't-fix; the reason follows it.

sonar.issue.ignore.multicriteria=e16,e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e17,e18,e19,e20,e21

# function size and the panic guards bound complexity here
sonar.issue.ignore.multicriteria.e1.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.rs

# maintenance scripts
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# blocking process calls in synchronous test helpers
sonar.issue.ignore.multicriteria.e3.ruleKey=rust:S7487
sonar.issue.ignore.multicriteria.e3.resourceKey=**/tests/**

# example binaries
sonar.issue.ignore.multicriteria.e4.ruleKey=rust:S7487
sonar.issue.ignore.multicriteria.e4.resourceKey=**/examples/**

# blocking file calls in tests
sonar.issue.ignore.multicriteria.e5.ruleKey=rust:S7493
sonar.issue.ignore.multicriteria.e5.resourceKey=**/tests/**

# example binaries
sonar.issue.ignore.multicriteria.e6.ruleKey=rust:S7493
sonar.issue.ignore.multicriteria.e6.resourceKey=**/examples/**

# use super::* in child modules is the module idiom here
sonar.issue.ignore.multicriteria.e7.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.rs

# use super::* is the test module convention
sonar.issue.ignore.multicriteria.e8.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*_tests.rs

# use super::* is the test module convention
sonar.issue.ignore.multicriteria.e9.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*_tests_*.rs

# POSIX test syntax is deliberate in scripts
sonar.issue.ignore.multicriteria.e10.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*.sh

# case statements without a default are intentional
sonar.issue.ignore.multicriteria.e11.ruleKey=shelldre:S131
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*.sh

# arguments come from trusted CI callers
sonar.issue.ignore.multicriteria.e12.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.e12.resourceKey=scripts/**

# arguments come from trusted CI callers
sonar.issue.ignore.multicriteria.e13.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e13.resourceKey=scripts/**

# package order follows installation groups
sonar.issue.ignore.multicriteria.e14.ruleKey=docker:S7018
sonar.issue.ignore.multicriteria.e14.resourceKey=**/Dockerfile

# repeated literals in database fixtures
sonar.issue.ignore.multicriteria.e15.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e15.resourceKey=tests/fixtures/**

# one-time schema migration backup on the history runtime, never on the GTK thread
sonar.issue.ignore.multicriteria.e16.ruleKey=rust:S7493
sonar.issue.ignore.multicriteria.e16.resourceKey=**/storage/src/query_history.rs

# test fixture URLs with made-up passwords
sonar.issue.ignore.multicriteria.e17.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e17.resourceKey=**/storage/src/connection_url.rs

# a deliberately blocking closure inside a test of the approval timeout
sonar.issue.ignore.multicriteria.e18.ruleKey=rust:S7488
sonar.issue.ignore.multicriteria.e18.resourceKey=**/agentd/src/main.rs

# a subprocess helper that holds a lock with a blocking sleep
sonar.issue.ignore.multicriteria.e19.ruleKey=rust:S7488
sonar.issue.ignore.multicriteria.e19.resourceKey=**/storage/src/file_access.rs

# MySQL manual fixtures, VARCHAR2 is Oracle syntax
sonar.issue.ignore.multicriteria.e20.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.e20.resourceKey=tests/manual-connections/**

# regular expressions in the checkers are kept readable by name
sonar.issue.ignore.multicriteria.e21.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e21.resourceKey=scripts/**

# Coverage is measured by cargo-llvm-cov in the nightly workflow, not uploaded to Sonar, so the
# new-code coverage condition would always read 0 percent and fail the gate
sonar.coverage.exclusions=**/*
