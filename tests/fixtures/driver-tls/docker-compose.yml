name: tablepro-driver-tls

services:
  mongo:
    build:
      context: .
      dockerfile: mongo/Dockerfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: tablepro
      MONGO_INITDB_ROOT_PASSWORD: tablepro
      MONGO_INITDB_DATABASE: tablepro
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    command:
      - mongod
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --tlsAllowConnectionsWithoutCertificates
      - --bind_ip_all
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile
        - /certs/ca.crt
        - --host
        - localhost
        - -u
        - tablepro
        - -p
        - tablepro
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      fixture:
        aliases:
          - mongo.tablepro.test

  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    command:
      - redis-server
      - --tls-port
      - "6379"
      - --port
      - "0"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - tablepro
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --tls
        - --cacert
        - /certs/ca.crt
        - -a
        - tablepro
        - --no-auth-warning
        - ping
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      fixture:
        aliases:
          - redis.tablepro.test

  mongo-plain:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: tablepro
      MONGO_INITDB_ROOT_PASSWORD: tablepro
      MONGO_INITDB_DATABASE: tablepro
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - localhost
        - -u
        - tablepro
        - -p
        - tablepro
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:27019:27017"
    networks:
      - fixture

  redis-plain:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "tablepro"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tablepro", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - fixture

  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: tablepro
      MYSQL_DATABASE: tablepro
      MYSQL_USER: tablepro
      MYSQL_PASSWORD: tablepro
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      # `mysqladmin ping` reports the server alive before initialisation has
      # created the application user, which lets tests start too early. Run a
      # real authenticated query instead, over the local socket so that
      # require_secure_transport does not apply to the probe itself.
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -utablepro
        - -ptablepro
        - -Dtablepro
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      fixture:
        aliases:
          - mysql.tablepro.test

  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: tablepro
      POSTGRES_PASSWORD: tablepro
      POSTGRES_DB: tablepro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tablepro", "-d", "tablepro"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - fixture

  mysql-ssh:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: tablepro
      MYSQL_DATABASE: tablepro
      MYSQL_USER: tablepro
      MYSQL_PASSWORD: tablepro
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -utablepro
        - -ptablepro
        - -Dtablepro
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mysql-ssh.tablepro.test

  mysql-mtls:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: tablepro
      MYSQL_DATABASE: tablepro
      MYSQL_USER: tablepro_mtls
      MYSQL_PASSWORD: tablepro
    volumes:
      - ./mysql-mtls/require-client-cert.sql:/docker-entrypoint-initdb.d/10-require-client-cert.sql:ro
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -uroot
        - -ptablepro
        - -Dtablepro
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:3309:3306"
    networks:
      fixture:
        aliases:
          - mysql-mtls.tablepro.test

  mysql-mtls-ssh:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: tablepro
      MYSQL_DATABASE: tablepro
      MYSQL_USER: tablepro_mtls
      MYSQL_PASSWORD: tablepro
    volumes:
      - ./mysql-mtls/require-client-cert.sql:/docker-entrypoint-initdb.d/10-require-client-cert.sql:ro
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -uroot
        - -ptablepro
        - -Dtablepro
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mysql-mtls-ssh.tablepro.test

  ssh-bastion:
    build:
      context: .
      dockerfile: ssh-bastion/Dockerfile
    ports:
      - "127.0.0.1:2224:2222"
    networks:
      - fixture
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 3s
      retries: 20

  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    environment:
      CLICKHOUSE_USER: tablepro
      CLICKHOUSE_PASSWORD: tablepro
      CLICKHOUSE_DB: tablepro
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - tablepro
        - --password
        - tablepro
        - --query
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:8444:8443"
    networks:
      fixture:
        aliases:
          - clickhouse.tablepro.test

  mysql-plain:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tablepro
      MYSQL_DATABASE: tablepro
      MYSQL_USER: tablepro
      MYSQL_PASSWORD: tablepro
    command: ["mysqld", "--tls-version="]
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -utablepro
        - -ptablepro
        - -Dtablepro
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:3308:3306"
    networks:
      - fixture

  clickhouse-plain:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: tablepro
      CLICKHOUSE_PASSWORD: tablepro
      CLICKHOUSE_DB: tablepro
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - tablepro
        - --password
        - tablepro
        - --query
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:8445:8123"
    networks:
      - fixture

  mssql:
    build:
      context: .
      dockerfile: mssql/Dockerfile
      args:
        TLS_ENABLED: "1"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "TablePro_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U tablepro -P tablepro -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:1434:1433"
    networks:
      fixture:
        aliases:
          - mssql.tablepro.test

  mssql-ssh:
    build:
      context: .
      dockerfile: mssql/Dockerfile
      args:
        TLS_ENABLED: "1"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "TablePro_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U tablepro -P tablepro -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mssql-ssh.tablepro.test

  mssql-plain:
    build:
      context: .
      dockerfile: mssql/Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "TablePro_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U tablepro -P tablepro -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:1435:1433"
    networks:
      - fixture

networks:
  fixture:
    driver: bridge
