[libdefaults]
default_realm = DOMAIN1.SINK.TEST
default_keytab_name = /var/opt/mssql/secrets/mssql.keytab
default_ccache_name = ""
dns_lookup_kdc = false
dns_lookup_realm = false
rdns = false

[realms]
DOMAIN1.SINK.TEST = {
    kdc = dc1.domain1.sink.test
    admin_server = dc1.domain1.sink.test
    default_domain = domain1.sink.test
}

[domain_realm]
.domain1.sink.test = DOMAIN1.SINK.TEST
domain1.sink.test = DOMAIN1.SINK.TEST
