# Restrict the dedicated mTLS role to TLS connections with a CA-verified client
# certificate. The ordinary fixture role keeps its existing password-only path.
local all all trust
hostnossl tablepro tablepro_mtls all reject
hostssl tablepro tablepro_mtls all scram-sha-256 clientcert=verify-ca
hostssl all all all scram-sha-256
host all all all scram-sha-256
